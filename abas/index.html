<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seta Soluções - Painel</title>
  <meta name="description" content="Painel de acesso rápido às soluções da Seta Soluções.">
  <meta name="theme-color" content="#050b2e">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --azul-profundo: #030824;
      --azul-noite: #071140;
      --azul-seta: #1c33e6;
      --azul-claro: #4f7bff;
      --laranja: #ff7a00;
      --laranja-claro: #ffa53d;
      --texto: #f4f6ff;
      --texto-suave: #a9b4dc;
      --vidro: rgba(255, 255, 255, 0.06);
      --borda: rgba(255, 255, 255, 0.10);
      --raio: 18px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--azul-profundo);
      color: var(--texto);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== Fundo animado ===== */
    .fundo {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(28, 51, 230, 0.45), transparent 60%),
        linear-gradient(180deg, var(--azul-noite) 0%, var(--azul-profundo) 70%);
    }
    .fundo::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 75%);
    }
    .bolha {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.55;
      animation: flutuar 18s ease-in-out infinite alternate;
    }
    .bolha.b1 { width: 480px; height: 480px; background: var(--azul-seta); top: -120px; left: -120px; }
    .bolha.b2 { width: 380px; height: 380px; background: var(--laranja); bottom: -140px; right: -100px; opacity: 0.28; animation-delay: -6s; }
    .bolha.b3 { width: 300px; height: 300px; background: var(--azul-claro); top: 40%; right: 20%; opacity: 0.22; animation-delay: -12s; }
    @keyframes flutuar {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, 40px) scale(1.15); }
    }

    /* ===== Cabeçalho ===== */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(3, 8, 36, 0.65);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border-bottom: 1px solid var(--borda);
    }
    header::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: -1px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--azul-claro), var(--laranja), transparent);
      background-size: 200% 100%;
      animation: brilho 6s linear infinite;
    }
    @keyframes brilho { to { background-position: 200% 0; } }

    .topo {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0.9rem 1.5rem;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 1.5rem;
    }

    .logo {
      display: block;
      position: relative;
      height: 72px;
      aspect-ratio: 12 / 5;
      background: #0a1a9e;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--borda);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 122, 0, 0.0);
      transition: transform 0.4s var(--ease), box-shadow 0.4s var(--ease);
    }
    /* recorte exato da arte do logo (sem zoom, para não perder nitidez) */
    .logo img {
      position: absolute;
      width: 128%;
      height: 204.8%;
      left: -18.33%;
      top: -35%;
      max-width: none;
      display: block;
    }
    .logo:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 0 2px var(--laranja);
    }

    .marca { text-align: center; min-width: 0; }
    .marca h1 {
      font-family: 'Sora', sans-serif;
      font-weight: 800;
      font-size: clamp(1.35rem, 2.6vw, 2rem);
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .marca h1 span {
      background: linear-gradient(90deg, var(--laranja), var(--laranja-claro));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .marca p {
      margin-top: 0.25rem;
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--texto-suave);
    }

    /* ===== Saudação ===== */
    .saudacao {
      max-width: 1240px;
      margin: 2.6rem auto 0;
      padding: 0 1.5rem;
      text-align: center;
      animation: subir 0.9s var(--ease) both;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.45rem 1rem;
      border-radius: 999px;
      background: var(--vidro);
      border: 1px solid var(--borda);
      font-size: 0.82rem;
      color: var(--texto-suave);
    }
    .chip .ponto {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--laranja);
      box-shadow: 0 0 0 0 rgba(255, 122, 0, 0.7);
      animation: pulso 2s infinite;
    }
    .chip strong { color: var(--texto); font-variant-numeric: tabular-nums; }
    @keyframes pulso {
      0%   { box-shadow: 0 0 0 0 rgba(255, 122, 0, 0.6); }
      70%  { box-shadow: 0 0 0 10px rgba(255, 122, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 122, 0, 0); }
    }

    .saudacao h2 {
      margin-top: 1.1rem;
      font-family: 'Sora', sans-serif;
      font-weight: 800;
      font-size: clamp(2rem, 5vw, 3.4rem);
      letter-spacing: -0.03em;
      line-height: 1.05;
    }
    .saudacao h2 .destaque {
      background: linear-gradient(100deg, #ffffff 10%, var(--laranja-claro) 50%, var(--laranja) 90%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .frase {
      margin: 0.9rem auto 0;
      max-width: 640px;
      min-height: 3.2em;
      font-size: clamp(0.98rem, 1.6vw, 1.12rem);
      line-height: 1.6;
      color: var(--texto-suave);
      transition: opacity 0.6s var(--ease), transform 0.6s var(--ease);
    }
    .frase.saindo { opacity: 0; transform: translateY(8px); }
    .frase::before { content: '“'; color: var(--laranja); font-weight: 700; margin-right: 2px; }
    .frase::after  { content: '”'; color: var(--laranja); font-weight: 700; margin-left: 2px; }

    /* ===== Grade de cards ===== */
    main {
      flex: 1;
      width: 100%;
      max-width: 1240px;
      margin: 2.4rem auto 3.5rem;
      padding: 0 1.5rem;
    }

    .grade {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1.1rem;
    }

    .card {
      position: relative;
      display: block;
      aspect-ratio: 4 / 5;
      border-radius: var(--raio);
      overflow: hidden;
      text-decoration: none;
      color: var(--texto);
      background: var(--azul-noite);
      border: 1px solid var(--borda);
      isolation: isolate;
      opacity: 0;
      transform: translateY(24px);
      animation: subir 0.8s var(--ease) forwards;
      animation-delay: calc(var(--i) * 70ms + 200ms);
      transition: transform 0.45s var(--ease), box-shadow 0.45s var(--ease), border-color 0.45s var(--ease);
    }
    @keyframes subir { to { opacity: 1; transform: translateY(0); } from { opacity: 0; transform: translateY(24px); } }

    .card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
      transform: scale(1.02);
      transition: transform 0.9s var(--ease), filter 0.6s var(--ease);
      filter: saturate(1.05);
    }
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, rgba(3, 8, 36, 0.05) 30%, rgba(3, 8, 36, 0.55) 62%, rgba(3, 8, 36, 0.95) 100%);
      transition: background 0.5s var(--ease);
    }
    .card::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--azul-claro), var(--laranja));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.5s var(--ease);
    }

    .card .nome {
      position: absolute;
      left: 1rem; right: 1rem; bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      font-family: 'Sora', sans-serif;
      font-weight: 700;
      font-size: clamp(0.9rem, 1.4vw, 1.1rem);
      line-height: 1.2;
      letter-spacing: -0.01em;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }
    .card .seta {
      flex-shrink: 0;
      display: grid;
      place-items: center;
      width: 30px; height: 30px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: background 0.4s var(--ease), transform 0.4s var(--ease);
    }
    .card .seta svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

    .card:hover, .card:focus-visible {
      transform: translateY(-6px);
      border-color: rgba(255, 122, 0, 0.7);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 122, 0, 0.25);
      outline: none;
    }
    .card:hover img, .card:focus-visible img { transform: scale(1.12); filter: saturate(1.2); }
    .card:hover::after, .card:focus-visible::after { transform: scaleX(1); }
    .card:hover .seta, .card:focus-visible .seta { background: var(--laranja); transform: rotate(-45deg); }

    /* ===== Rodapé ===== */
    footer {
      border-top: 1px solid var(--borda);
      background: rgba(3, 8, 36, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 1.4rem 1.5rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--texto-suave);
    }
    footer .contatos {
      margin-top: 0.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem;
    }
    footer a {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.45rem 0.95rem;
      border-radius: 999px;
      border: 1px solid var(--borda);
      background: var(--vidro);
      color: var(--texto);
      text-decoration: none;
      transition: border-color 0.3s, background 0.3s, transform 0.3s var(--ease);
    }
    footer a:hover { border-color: var(--laranja); background: rgba(255, 122, 0, 0.12); transform: translateY(-2px); }
    footer a svg { width: 16px; height: 16px; fill: var(--laranja); }

    /* ===== Responsivo ===== */
    @media (max-width: 720px) {
      .topo { gap: 0.7rem; padding: 0.7rem 1rem; }
      .logo { height: 38px; border-radius: 9px; }
      .marca h1 { font-size: 1.15rem; }
      .marca p { font-size: 0.62rem; letter-spacing: 0.14em; }
      .saudacao { margin-top: 1.8rem; }
      .chip { font-size: 0.74rem; padding: 0.4rem 0.85rem; }
      main { padding: 0 1rem; margin-top: 1.8rem; }
      .grade { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
      .card { aspect-ratio: 1 / 1; }
      .card .nome { font-size: 0.88rem; left: 0.7rem; right: 0.7rem; bottom: 0.7rem; }
      .card .seta { width: 26px; height: 26px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .card { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="fundo" aria-hidden="true">
    <div class="bolha b1"></div>
    <div class="bolha b2"></div>
    <div class="bolha b3"></div>
  </div>

  <header>
    <div class="topo">
      <a class="logo" href="https://www.setasolucoes.com.br/" target="_blank" rel="noopener noreferrer" aria-label="Seta Soluções">
        <img src="logo.png" alt="Logo Seta Soluções" onerror="this.onerror=null;this.src='https://www.setasolucoes.com.br/logo.png'">
      </a>
      <div class="marca">
        <h1>Seta <span>Soluções</span></h1>
        <p>Tecnologia e Soluções Inteligentes</p>
      </div>
      <a class="logo" href="https://www.setasolucoes.com.br/" target="_blank" rel="noopener noreferrer" aria-label="Seta Soluções">
        <img src="logo.png" alt="Logo Seta Soluções" onerror="this.onerror=null;this.src='https://www.setasolucoes.com.br/logo.png'">
      </a>
    </div>
  </header>

  <section class="saudacao">
    <div class="chip"><span class="ponto"></span><span id="data-atual">Carregando...</span> • <strong id="relogio">--:--</strong></div>
    <h2><span id="saudacao" class="destaque">Olá!</span></h2>
    <p class="frase" id="frase">Grandes conquistas começam com pequenos passos.</p>
  </section>

  <main>
    <nav class="grade" id="grade" aria-label="Acesso rápido"></nav>
  </main>

  <footer>
    <p>&copy; <span id="ano">2026</span> Seta Soluções. Todos os direitos reservados.</p>
    <div class="contatos">
      <a href="https://wa.me/5531984821901" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21c5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm5.8 14.03c-.24.68-1.42 1.3-1.95 1.36-.5.06-1.13.09-1.82-.11-.42-.13-.96-.31-1.65-.61-2.9-1.25-4.79-4.17-4.94-4.36-.14-.19-1.18-1.57-1.18-3s.75-2.13 1.02-2.42c.26-.29.58-.36.77-.36h.55c.18 0 .42-.07.65.5.24.58.82 2 .89 2.14.07.15.12.32.02.51-.1.19-.14.31-.29.48-.14.17-.3.37-.43.5-.14.14-.29.3-.13.59.17.29.74 1.22 1.59 1.98 1.09.97 2.01 1.27 2.3 1.41.29.15.46.12.62-.07.17-.19.72-.84.91-1.13.19-.29.38-.24.65-.14.26.1 1.68.79 1.97.94.29.14.48.22.55.34.07.12.07.7-.17 1.38z"/></svg>
        (31) 98482-1901
      </a>
      <a href="mailto:setamarcos@gmail.com">
        <svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4.24-8 5-8-5V6l8 5 8-5v2.24z"/></svg>
        setamarcos@gmail.com
      </a>
    </div>
  </footer>

  <script>
    // ===== Cards (edite aqui para adicionar/remover) =====
    const img = (id) => `https://images.unsplash.com/photo-${id}?w=600&q=80&auto=format&fit=crop`;
    const cards = [
      { nome: 'Seta Início',            link: '/',                                              foto: img('1615774925655-a0e97fc85c14') },
      { nome: 'Brasil em Jogo',         link: 'https://www.setasolucoes.com.br/brasilemjogo/', foto: img('1601118964938-228a89955311') },
      { nome: 'É Assim que Usa IA',          link: 'https://prompt-polish-workshop.lovable.app/',   foto: img('1526378722484-bd91ca387e72') },
      { nome: 'Aluguel',                link: 'https://www.setasolucoes.com.br/aluguel/',      foto: img('1640531784350-0ddbb5f82795') },
      { nome: 'Laura',                  link: '/laura/',                                        foto: img('1596495868845-63031cb496da') },
      { nome: 'CEDAF 2026',             link: 'https://www.setasolucoes.com.br/cedaf2026/',    foto: img('1522202176988-66273c2fd55f') },
      { nome: 'Prospect Governança MP', link: '/prospect-governanca-mp/',                       foto: img('1597502310092-31cdaa35b46d') },
      { nome: 'Livro',                  link: 'https://www.setasolucoes.com.br/livro',         foto: img('1481627834876-b7833e8f5570') },
      { nome: 'Verônica',               link: 'https://www.setasolucoes.com.br/veronica/',     foto: img('1519415510236-718bdfcd89c8') },
      { nome: 'Simone Semijoias',       link: 'https://www.setasolucoes.com.br/simonesemijoias/', foto: img('1599643478518-a784e5dc4c8f') }
    ];

    const grade = document.getElementById('grade');
    grade.innerHTML = cards.map((c, i) => `
      <a class="card" href="${c.link}" target="_blank" rel="noopener noreferrer" style="--i:${i}" aria-label="Abrir ${c.nome} em nova guia">
        <img src="${c.foto}" alt="" loading="${i < 6 ? 'eager' : 'lazy'}" decoding="async">
        <span class="nome">${c.nome}
          <span class="seta"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </span>
      </a>`).join('');

    // ===== Saudação, data e relógio =====
    function atualizarHora() {
      const agora = new Date();
      const h = agora.getHours();
      const saudacao = h >= 5 && h < 12 ? 'Bom dia!' : h >= 12 && h < 18 ? 'Boa tarde!' : 'Boa noite!';
      document.getElementById('saudacao').textContent = saudacao;
      const data = agora.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      document.getElementById('data-atual').textContent = data.charAt(0).toUpperCase() + data.slice(1);
      document.getElementById('relogio').textContent =
        agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('ano').textContent = agora.getFullYear();
    }
    atualizarHora();
    setInterval(atualizarHora, 1000 * 15);

    // ===== 20 frases motivacionais =====
    const frases = [
      'Grandes conquistas começam com pequenos passos dados todos os dias.',
      'A persistência transforma o impossível em inevitável.',
      'Faça hoje o que o seu futuro vai agradecer amanhã.',
      'Disciplina é a ponte entre metas e realizações.',
      'Quem planta com dedicação colhe com orgulho.',
      'O sucesso é a soma de pequenos esforços repetidos diariamente.',
      'Acredite no seu potencial: ele é maior do que você imagina.',
      'Inovar é enxergar oportunidades onde outros veem obstáculos.',
      'Cada desafio é uma chance de mostrar do que você é capaz.',
      'Não espere por oportunidades, crie-as.',
      'A energia que você coloca no dia define o resultado que você colhe.',
      'Seja a seta que aponta para frente, sempre.',
      'Foco no progresso, não na perfeição.',
      'O melhor momento para começar é agora.',
      'Trabalho em equipe transforma ideias em resultados.',
      'Sonhe grande, comece pequeno, mas comece hoje.',
      'A coragem de tentar é o primeiro passo para vencer.',
      'Tecnologia é ferramenta; atitude é o que faz a diferença.',
      'Quem se prepara não precisa ter sorte.',
      'Seu esforço de hoje é o seu sucesso de amanhã.'
    ];
    const elFrase = document.getElementById('frase');
    let idx = Math.floor(Math.random() * frases.length);
    elFrase.textContent = frases[idx];
    setInterval(() => {
      elFrase.classList.add('saindo');
      setTimeout(() => {
        idx = (idx + 1) % frases.length;
        elFrase.textContent = frases[idx];
        elFrase.classList.remove('saindo');
      }, 600);
    }, 8000);
  </script>
</body>
</html>
