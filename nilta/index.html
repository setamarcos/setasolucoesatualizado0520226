<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestão Nilta</title>
<style>
:root{--p:#0b5d3b;--bg:#f4f8f5;--w:#fff;--txt:#333;--gr:#ccc}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt)}
main{max-width:600px;margin:auto;padding:16px}
h1{color:var(--p);margin:0 0 4px;font-size:24px}
.card{background:var(--w);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 2px 10px #0001}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{font-size:13px;font-weight:600;display:block;color:#555}
input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--gr);border-radius:8px;margin-top:4px;font-size:16px;background:#fafafa}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center;margin-top:16px}
.res-box{background:var(--bg);padding:10px;border-radius:8px;font-size:12px}
.res-box b{display:block;font-size:16px;color:var(--p)}
.lucro-box{background:var(--p);color:var(--w);grid-column:span 2;padding:16px;border-radius:8px;text-align:center}
.lucro-box span{font-size:12px;opacity:0.9}
.lucro-box b{display:block;font-size:32px;margin:4px 0}
.btn{width:100%;padding:14px;border-radius:8px;border:0;background:var(--p);color:var(--w);font-weight:bold;font-size:16px;cursor:pointer;display:block;text-align:center;text-decoration:none;transition:opacity .2s}
.btn:active{opacity:.8}
.dash{display:flex;justify-content:space-between;background:var(--bg);padding:12px;border-radius:8px;margin-bottom:16px;text-align:center}
.dash div{flex:1;border-right:1px solid #ddd}
.dash div:last-child{border:0}
.dash b{display:block;color:var(--p);font-size:15px;margin-top:4px}
.hist-item{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:12px 0;font-size:13px}
.hist-item:last-child{border:0}
.badge{background:#e8f5e9;color:var(--p);padding:2px 6px;border-radius:4px;font-size:11px;font-weight:bold}
</style>
</head>
<body>
<main>
  <h1>Nilta 🚗</h1>
  <p style="font-size:14px;margin-top:0;color:#666">App de Gestão Financeira</p>

  <div class="card">
    <div class="grid-2">
      <label>📅 Data <input id="data" type="date"></label>
      <label>⏰ Hora <input id="hora" type="time"></label>
      <label>💰 Bruto (R$) <input id="bruto" type="number" step="0.01" value="350"></label>
      <label>🛣️ Km <input id="km" type="number" value="120"></label>
      <label>⛽ Combust. (R$) <input id="comb" type="number" step="0.01" value="85"></label>
      <label>⏱️ Horas trab. <input id="horas" type="number" step="0.1" value="8"></label>
    </div>
    <label style="margin-top:12px">📝 Observação <textarea id="obs" rows="2" placeholder="Opcional..."></textarea></label>

    <div class="res-grid">
      <div class="res-box">Prestação<b>R$ 107,45</b></div>
      <div class="res-box">Documentos<b>R$ 17,50</b></div>
      <div class="res-box">Manutenção<b>R$ 8,33</b></div>
      <div class="res-box">Combustível<b id="vComb">R$ 0,00</b></div>
      <div class="lucro-box">
        <span>LUCRO LÍQUIDO</span>
        <b id="vLucro">R$ 0,00</b>
        <span id="vHora">R$ 0,00/h</span> &nbsp;|&nbsp; <b id="vSitu" style="display:inline;font-size:12px">--</b>
      </div>
    </div>
    
    <button class="btn" id="salvar" style="margin-top:16px">💾 Salvar na Planilha</button>
    <div id="status" style="text-align:center;font-size:13px;margin-top:8px;height:16px;color:var(--p);font-weight:bold"></div>
  </div>

  <div class="card">
    <h2 style="font-size:16px;margin:0 0 12px;color:var(--p)">📊 Consolidado</h2>
    <div class="dash">
      <div>Semana<b id="rSem">--</b></div>
      <div>Mês<b id="rMes">--</b></div>
      <div>Ano<b id="rAno">--</b></div>
    </div>
    <h3 style="font-size:14px;margin:0 0 8px;color:#555">🕒 Histórico Recente</h3>
    <div id="hist">Aguardando servidor...</div>
  </div>

  <a class="btn" style="background:#222" href="https://docs.google.com/spreadsheets/d/1xDDXgHOJBcoQDhE1AJcOtSvrTkK3votsfjgM66FfxiE/edit?gid=1335530388#gid=1335530388" target="_blank">📄 Abrir Planilha Base</a>
</main>

<script>
const SCRIPT = "https://script.google.com/macros/s/AKfycbx8UFf2a4l9jsEFrVS2FSlm3PE8RuVYq_0SCxdw0RrpxjOBG9KtYFMzO-zVqXKHorYz8g/exec"; 
const FIXO = 133.28;
const fmt = v => Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

const now = new Date();
data.value = now.toISOString().split('T')[0];
hora.value = now.toTimeString().slice(0,5);

function calc() {
  const b = +bruto.value||0, c = +comb.value||0, h = +horas.value||1;
  const lucro = b - c - FIXO;
  vComb.textContent = fmt(c);
  vLucro.textContent = fmt(lucro);
  vHora.textContent = fmt(lucro/h) + "/h";
  vSitu.textContent = lucro >= 130 ? "🟢 Meta Batida" : lucro > 0 ? "🟡 Baixo" : "🔴 Prejuízo";
  return { b, c, km: +km.value||0, h, lucro };
}

['bruto','comb','km','horas'].forEach(id => window[id].addEventListener('input', calc));
calc();

async function carregarResumo() {
  try {
    let r = await fetch(SCRIPT + "?action=resumo");
    let j = await r.json();
    rSem.textContent = fmt(j.semana);
    rMes.textContent = fmt(j.mes);
    rAno.textContent = fmt(j.ano);
    hist.innerHTML = j.ultimos.length ? j.ultimos.map(l => 
      `<div class="hist-item">
        <div><b>${l.data}</b> <span class="badge">${l.hora}</span><br><span style="color:#666">${l.km}km | Bruto: ${fmt(l.bruto)}</span></div>
        <div style="text-align:right"><b style="color:${l.lucro>0?'var(--p)':'#d32f2f'}">${fmt(l.lucro)}</b><br><span style="font-size:11px;color:#888">${l.obs||'-'}</span></div>
      </div>`
    ).join('') : "<div style='text-align:center;color:#999'>Nenhum registro.</div>";
  } catch(e) {
    hist.innerHTML = "<div style='text-align:center;color:#d32f2f'>Acesso bloqueado pelo Google. Verifique as permissões do WebApp.</div>";
  }
}
carregarResumo();

salvar.onclick = async () => {
  const d = calc();
  const params = new URLSearchParams({
    action: 'salvar',
    data: data.value.split('-').reverse().join('/'),
    hora: hora.value,
    bruto: d.b, km: d.km, comb: d.c, horas: d.h, obs: obs.value
  });
  
  status.textContent = "⏳ Salvando...";
  salvar.disabled = true;
  salvar.style.opacity = "0.5";
  
  try {
    await fetch(SCRIPT + "?" + params.toString(), {mode: 'no-cors'});
    status.textContent = "✅ Salvo com sucesso!";
    obs.value = "";
    setTimeout(() => { status.textContent = ""; carregarResumo(); }, 1500);
  } catch(e) {
    status.textContent = "❌ Erro ao salvar.";
  }
  salvar.disabled = false;
  salvar.style.opacity = "1";
};
</script>
</body>
</html>
