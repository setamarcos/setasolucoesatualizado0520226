function aoDigitarTelefone(input){
  let v = input.value.replace(/\D/g, "");
  if(v.length > 11) v = v.slice(0, 11);
  if(v.length > 2) v = "(" + v.substring(0,2) + ") " + v.substring(2);
  if(v.length > 9) v = v.substring(0,10) + "-" + v.substring(10);
  input.value = v;

  const telClean = v.replace(/\D/g, "");
  if(telClean.length === 11){
    const alunosSalvos = JSON.parse(localStorage.getItem('alunos_registrados') || '{}');
    if(alunosSalvos[telClean]){
      document.getElementById('inputNome').value = alunosSalvos[telClean];
      document.getElementById('inputNome').readOnly = true;
    } else {
      document.getElementById('inputNome').readOnly = false;
    }
  }
}

function validarELogar(){
  const nomeInput = document.getElementById('inputNome').value.trim();
  const telInput = document.getElementById('inputTelefone').value.trim();
  const telClean = telInput.replace(/\D/g, "");
  const errBox = document.getElementById('msgErro');

  if(telClean.length !== 11){
    errBox.style.display = 'block';
    errBox.textContent = "⚠️ Insira um número de telefone celular válido com DDD.";
    return;
  }

  if(!nomeInput || nomeInput.length < 3){
    errBox.style.display = 'block';
    errBox.textContent = "⚠️ Por favor, preencha o nome do aluno.";
    return;
  }

  const alunosSalvos = JSON.parse(localStorage.getItem('alunos_registrados') || '{}');
  if(alunosSalvos[telClean] && alunosSalvos[telClean].toLowerCase() !== nomeInput.toLowerCase()){
    errBox.style.display = 'block';
    errBox.textContent = `⚠️ Este telefone já pertence ao aluno "${alunosSalvos[telClean]}".`;
    return;
  }

  alunosSalvos[telClean] = nomeInput;
  localStorage.setItem('alunos_registrados', JSON.stringify(alunosSalvos));

  errBox.style.display = 'none';
  userLogin = nomeInput;
  userTelefone = telInput;
  tempoInicioApp = new Date();

  const progressoAlunos = JSON.parse(localStorage.getItem('progresso_provas') || '{}');
  let qtdFeitas = progressoAlunos[telClean] || 0;
  numeroProvaAtual = (qtdFeitas % 15) + 1;

  document.getElementById('loginModal').style.display = 'none';
  document.getElementById('areaAplicacao').style.display = 'block';

  document.getElementById('exibirNomeAluno').textContent = userLogin;
  document.getElementById('exibirTelefone').textContent = userTelefone;
  document.getElementById('exibirIdentificadorProva').textContent = `Prova ${String(numeroProvaAtual).padStart(2, '0')}`;

  atualizarDataHora();
  gerarProvaSequencial();
}

function modo(m){
  salvarTextoRedacao();
  modoAtual=m;
  document.querySelectorAll('.btn-topo').forEach(b=>b.classList.remove('ativo'));
  document.getElementById(`btn${m.charAt(0).toUpperCase()+m.slice(1)}`).classList.add('ativo');
  montarProva();
}

// ITEM 1: AUTOSAVE DE REDAÇÃO NO LOCALSTORAGE
function salvarTextoRedacao(){
  const el = document.getElementById('textoRedacao');
  if(el){
    textoRedacaoSalvo = el.value;
    const chave = `rascunho_redacao_PROVA_${String(numeroProvaAtual).padStart(2, '0')}`;
    localStorage.setItem(chave, textoRedacaoSalvo);
  }
}

function carregarRascunhoRedacao(){
  const chave = `rascunho_redacao_PROVA_${String(numeroProvaAtual).padStart(2, '0')}`;
  const rascunhoSalvo = localStorage.getItem(chave);
  if(rascunhoSalvo !== null){
    textoRedacaoSalvo = rascunhoSalvo;
  }
}

function limparRascunhoRedacao(){
  const chave = `rascunho_redacao_PROVA_${String(numeroProvaAtual).padStart(2, '0')}`;
  localStorage.removeItem(chave);
  textoRedacaoSalvo = '';
}

function gerarProvaSequencial(){
  carregarRascunhoRedacao();
  temaRedacaoAtual = bancoTemasRedacao[numeroProvaAtual - 1];

  const materias = ["Português", "Matemática", "Ciências", "História", "Geografia"];
  questoesSelecionadas = [];

  materias.forEach(mat => {
    const daMateria = bancoQuestoes9Ano.filter(q => q.materia === mat);
    const offset = ((numeroProvaAtual - 1) * 2) % daMateria.length;
    const q1 = daMateria[offset];
    const q2 = daMateria[(offset + 1) % daMateria.length];
    questoesSelecionadas.push(q1, q2);
  });

  respostas = Array(10).fill(null);
  resultadoRedacaoHTML = '';
  notaRedacao = 0;
  montarProva();
}

function montarProva(){
  salvarTextoRedacao();
  let html='';

  if(modoAtual==='texto'||modoAtual==='ambos'){
    html+=`
      <h3>📝 Redação - Prova ${String(numeroProvaAtual).padStart(2, '0')}</h3>
      <p style="font-weight:bold;color:var(--azul)">Tema: ${temaRedacaoAtual}</p>
      <p class="hint">Instruções: Seu rascunho é salvo automaticamente. Mesmo que a aba seja fechada, o texto estará preservado.</p>
      <textarea id="textoRedacao" class="textarea-redacao" placeholder="Desenvolva sua redação aqui..." oninput="salvarTextoRedacao()"></textarea>
      <button class="btn-seta" onclick="corrigirRedacao()">📊 Avaliar Redação</button>
      <div id="resultadoRedacao" style="display:none;margin-top:12px"></div>
      <hr>
    `;
  }
  
  if(modoAtual==='prova'||modoAtual==='ambos'){
    html+=`<h3>❓ Prova Objetiva - Prova ${String(numeroProvaAtual).padStart(2, '0')} (Exatamente 10 Questões)</h3>`;
    questoesSelecionadas.forEach((q,i)=>{
      const respAtual = respostas[i] ? respostas[i].letra : '';
      const tipoAtual = respostas[i] ? respostas[i].tipo : 'estudado';

      html+=`
        <div class="questao" id="q${i}">
          <div>
            <span class="tag-banca">${q.banca}</span>
            <span class="tag-materia">${q.materia}</span>
          </div>
          <p><strong>${i+1}. ${q.q}</strong></p>
      `;
      q.ops.forEach((op,idx)=>{
        const letra=['a','b','c','d'][idx];
        const classeSel = (respAtual === letra) ? 'selecionada' : '';
        html+=`<button class="btn-alt ${classeSel}" id="alt${i}${letra}" onclick="selecionar(${i},'${letra}')">${letra}) ${op}</button>`;
      });
      
      const estiloAcoes = respAtual ? 'block' : 'none';
      html+=`
        <div style="margin-top:8px;display:${estiloAcoes}" id="acoes${i}">
          <button class="btn-seta ${tipoAtual==='estudado'?'ativo':''}" id="btnEstudado${i}" onclick="confirmarTipo(${i},'estudado')">Já estudei</button>
          <button class="btn-seta btn-chute ${tipoAtual==='chute'?'ativo':''}" id="btnChute${i}" onclick="confirmarTipo(${i},'chute')">Chute</button>
        </div>
        </div><hr>
      `;
    });
    html+=`<button class="btn-seta" onclick="finalizar()" style="font-size:18px;width:100%">🚀 Finalizar Prova ${String(numeroProvaAtual).padStart(2, '0')} e Enviar Dados</button>`;
  }
  
  document.getElementById('areaProva').innerHTML = html;

  // Restaura o texto da redação do localStorage / variável global
  const elTextarea = document.getElementById('textoRedacao');
  if(elTextarea && textoRedacaoSalvo){
    elTextarea.value = textoRedacaoSalvo;
  }

  if(resultadoRedacaoHTML){
    const elRes = document.getElementById('resultadoRedacao');
    if(elRes){
      elRes.innerHTML = resultadoRedacaoHTML;
      elRes.style.display = 'block';
    }
  }
}

// SELEÇÃO DE QUESTÕES E BOTÕES "JÁ ESTUDEI" E "CHUTE" CORRIGIDOS E REATIVADOS
function selecionar(idx, letra){
  const tipoAnterior = (respostas[idx] && respostas[idx].tipo) ? respostas[idx].tipo : 'estudado';
  respostas[idx] = { letra: letra, tipo: tipoAnterior, confirmado: true };
  
  document.querySelectorAll(`#q${idx} .btn-alt`).forEach(b => b.classList.remove('selecionada'));
  const btnSel = document.getElementById(`alt${idx}${letra}`);
  if(btnSel) btnSel.classList.add('selecionada');

  const acoesEl = document.getElementById(`acoes${idx}`);
  if(acoesEl) acoesEl.style.display = 'block';

  confirmarTipo(idx, tipoAnterior);
}

// ITEM 2: LÓGICA DE TROCA E ATIVAÇÃO DOS BOTÕES "JÁ ESTUDEI" E "CHUTE"
function confirmarTipo(idx, tipo){
  if(!respostas[idx] || !respostas[idx].letra) return alert('Selecione uma alternativa primeiro!');
  respostas[idx].tipo = tipo;

  const btnEstudado = document.getElementById(`btnEstudado${idx}`);
  const btnChute = document.getElementById(`btnChute${idx}`);

  if(btnEstudado && btnChute){
    btnEstudado.classList.remove('ativo');
    btnChute.classList.remove('ativo');

    if(tipo === 'estudado'){
      btnEstudado.classList.add('ativo');
    } else if(tipo === 'chute'){
      btnChute.classList.add('ativo');
    }
  }
}

function corrigirRedacao(){
  salvarTextoRedacao();
  if(textoRedacaoSalvo.trim().length < 10) return alert('A redação precisa ter no mínimo 10 caracteres.');
  
  const palavras = textoRedacaoSalvo.trim().split(/\s+/).length;
  notaRedacao = Math.min(1000, Math.max(400, palavras * 10));
  
  resultadoRedacaoHTML = `
    <h4>Nota da Redação: ${notaRedacao}/1000</h4>
    <p class="hint">Volume textual: ${palavras} palavras | Avaliação preliminar concluída.</p>
  `;
  const elRes = document.getElementById('resultadoRedacao');
  if(elRes){
    elRes.innerHTML = resultadoRedacaoHTML;
    elRes.style.display = 'block';
  }
}

function finalizar(){
  salvarTextoRedacao();
  let acertosTotal = 0;
  let respondidas = 0;

  respostas.forEach((r,i) => {
    if(r && r.letra){
      respondidas++;
      if(r.letra === questoesSelecionadas[i].gab) acertosTotal++;
    }
  });

  if(modoAtual !== 'texto' && respondidas < 10){
    return alert(`Responda todas as 10 questões antes de finalizar! (Respondidas: ${respondidas}/10)`);
  }

  const notaQ = Math.round((acertosTotal / 10) * 1000);
  const notaFinalGeral = Math.round((notaQ + notaRedacao) / 2);
  
  const percentualMeta = Math.min(100, Math.round((notaFinalGeral / META_FIXA) * 100));
  let classeChance = "chance-baixa";
  let statusChance = "Risco Alto - Necessita reforço imediato";

  if(percentualMeta >= 95){
    classeChance = "chance-alta";
    statusChance = "Excelente! Altíssima probabilidade de aprovação na revisão final";
  } else if(percentualMeta >= 80){
    classeChance = "chance-media";
    statusChance = "Boa! Probabilidade média de aprovação, ajuste os pontos fracos";
  }

  let htmlResultado = `
    <h3>📊 Relatório Final - Prova ${String(numeroProvaAtual).padStart(2, '0')}</h3>
    <h2>Nota Média Final: ${notaFinalGeral} / 1000 pts (Meta Fixa: ${META_FIXA})</h2>
    <p><strong>Nota Objetiva:</strong> ${notaQ}/1000 (${acertosTotal}/10 acertos)</p>
    <p><strong>Nota Redação:</strong> ${notaRedacao}/1000</p>
    
    <div class="chance-box ${classeChance}">
      🎯 CHANCE DE SUCESSO NA REVISÃO FINAL: ${percentualMeta}%<br>
      <span style="font-size:14px;font-weight:normal">${statusChance}</span>
    </div>
  `;

  if(resultadoRedacaoHTML){
    htmlResultado += `<hr>${resultadoRedacaoHTML}`;
  }

  htmlResultado += `
    <div id="statusEnvio" style="font-weight:bold;color:var(--verde);margin-bottom:16px">⏳ Enviando dados para a planilha CEDAF...</div>
    <button class="btn-seta" style="font-size:16px;width:100%;padding:14px;background:var(--azul)" onclick="avancarParaProximaProva()">🎲 Fazer Próxima Prova (Prova ${String((numeroProvaAtual % 15) + 1).padStart(2, '0')})</button>
  `;
  
  document.getElementById('resultadoFinal').innerHTML = htmlResultado;
  document.getElementById('resultadoFinal').style.display = 'block';
  document.getElementById('areaProva').style.display = 'none';

  const telClean = userTelefone.replace(/\D/g, "");
  const progressoAlunos = JSON.parse(localStorage.getItem('progresso_provas') || '{}');
  progressoAlunos[telClean] = (progressoAlunos[telClean] || 0) + 1;
  localStorage.setItem('progresso_provas', JSON.stringify(progressoAlunos));

  enviarDadosAutomatico(notaQ, acertosTotal);
}

function avancarParaProximaProva(){
  const telClean = userTelefone.replace(/\D/g, "");
  const progressoAlunos = JSON.parse(localStorage.getItem('progresso_provas') || '{}');
  let qtdFeitas = progressoAlunos[telClean] || 0;
  numeroProvaAtual = (qtdFeitas % 15) + 1;

  document.getElementById('exibirIdentificadorProva').textContent = `Prova ${String(numeroProvaAtual).padStart(2, '0')}`;
  document.getElementById('resultadoFinal').style.display = 'none';
  document.getElementById('areaProva').style.display = 'block';

  gerarProvaSequencial();
}

function enviarDadosAutomatico(notaQ, acertosTotal){
  const agora = new Date();
  const tempoTotalMinutos = Math.max(1, Math.round((agora - tempoInicioApp) / 60000));
  const telClean = userTelefone.replace(/\D/g, "");
  const textoEscrito = textoRedacaoSalvo || "Redação não realizada nesta tentativa.";
  
  const chaveUnicaAluno = userLogin + "_" + telClean;

  const payload = {
    login: chaveUnicaAluno,
    data: agora.toLocaleDateString('pt-BR'),
    hora: agora.toLocaleTimeString('pt-BR'),
    prova: `Prova ${String(numeroProvaAtual).padStart(2, '0')}`,
    tema: temaRedacaoAtual,
    notaProva: notaQ,
    notaRedacao: notaRedacao,
    acertos: acertosTotal,
    tempoMinutos: tempoTotalMinutos,
    objetivoMeta: META_FIXA,
    textoRedacao: textoEscrito
  };

  fetch(URL_CEDAF, {
    method: 'POST',
    mode: 'no-cors',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  }).then(() => {
    document.getElementById('statusEnvio').innerHTML = "✅ Dados e redação registrados com sucesso na planilha CEDAF!";
    // LIMPA O RASCUNHO DO LOCALSTORAGE APÓS O ENVIO COM SUCESSO
    limparRascunhoRedacao();
  }).catch(err => {
    document.getElementById('statusEnvio').innerHTML = "❌ Erro ao registrar dados. Tente novamente.";
  });
}
</script>
</body>
</html>
