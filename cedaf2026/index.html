function aoDigitarTelefone(input){
  let v = input.value.replace(/\D/g, "");
  if(v.length > 11) v = v.slice(0, 11);
  if(v.length > 2) v = "(" + v.substring(0,2) + ") " + v.substring(2);
  if(v.length > 9) v = v.substring(0,10) + "-" + v.substring(10);
  input.value = v;

  const telClean = v.replace(/\D/g, "");
  if(telClean.length === 11){
    const alunosSalvos = JSON.parse(localStorage.getItem('alunos_registrados') || '{}');
    if(alunosSalvos[telClean]){
      document.getElementById('inputNome').value = alunosSalvos[telClean];
      document.getElementById('inputNome').readOnly = true;
    } else {
      document.getElementById('inputNome').readOnly = false;
    }
  }
}

function validarELogar(){
  const nomeInput = document.getElementById('inputNome').value.trim();
  const telInput = document.getElementById('inputTelefone').value.trim();
  const telClean = telInput.replace(/\D/g, "");
  const errBox = document.getElementById('msgErro');

  if(telClean.length !== 11){
    errBox.style.display = 'block';
    errBox.textContent = "⚠️ Insira um número de telefone celular válido com DDD.";
    return;
  }

  if(!nomeInput || nomeInput.length < 3){
    errBox.style.display = 'block';
    errBox.textContent = "⚠️ Por favor, preencha o nome do aluno.";
    return;
  }

  const alunosSalvos = JSON.parse(localStorage.getItem('alunos_registrados') || '{}');
  if(alunosSalvos[telClean] && alunosSalvos[telClean].toLowerCase() !== nomeInput.toLowerCase()){
    errBox.style.display = 'block';
    errBox.textContent = `⚠️ Este telefone já pertence ao aluno "${alunosSalvos[telClean]}".`;
    return;
  }

  alunosSalvos[telClean] = nomeInput;
  localStorage.setItem('alunos_registrados', JSON.stringify(alunosSalvos));

  errBox.style.display = 'none';
  userLogin = nomeInput;
  userTelefone = telInput;
  tempoInicioApp = new Date();

  const progressoAlunos = JSON.parse(localStorage.getItem('progresso_provas') || '{}');
  let qtdFeitas = progressoAlunos[telClean] || 0;
  numeroProvaAtual = (qtdFeitas % 15) + 1;

  document.getElementById('loginModal').style.display = 'none';
  document.getElementById('areaAplicacao').style.display = 'block';

  document.getElementById('exibirNomeAluno').textContent = userLogin;
  document.getElementById('exibirTelefone').textContent = userTelefone;
  document.getElementById('exibirIdentificadorProva').textContent = `Prova ${String(numeroProvaAtual).padStart(2, '0')}`;

  atualizarDataHora();
  gerarProvaSequencial();
}

function modo(m){
  salvarTextoRedacao();
  modoAtual=m;
  document.querySelectorAll('.btn-topo').forEach(b=>b.classList.remove('ativo'));
  document.getElementById(`btn${m.charAt(0).toUpperCase()+m.slice(1)}`).classList.add('ativo');
  montarProva();
}

function salvarTextoRedacao(){
  const el = document.getElementById('textoRedacao');
  if(el){
    textoRedacaoSalvo = el.value;
    const chave = `rascunho_redacao_PROVA_${String(numeroProvaAtual).padStart(2, '0')}`;
    localStorage.setItem(chave, textoRedacaoSalvo);
  }
}

function carregarRascunhoRedacao(){
  const chave = `rascunho_redacao_PROVA_${String(numeroProvaAtual).padStart(2, '0')}`;
  const rascunhoSalvo = localStorage.getItem(chave);
  if(rascunhoSalvo !== null){
    textoRedacaoSalvo = rascunhoSalvo;
  } else {
    textoRedacaoSalvo = ''; // LIMPEZA GARANTIDA PARA NOVA PROVA
  }
}

function limparRascunhoRedacao(){
  const chave = `rascunho_redacao_PROVA_${String(numeroProvaAtual).padStart(2, '0')}`;
  localStorage.removeItem(chave);
  textoRedacaoSalvo = '';
}

function gerarProvaSequencial(){
  carregarRascunhoRedacao();
  temaRedacaoAtual = bancoTemasRedacao[numeroProvaAtual - 1];

  const materias = ["Português", "Matemática", "Ciências", "História", "Geografia"];
  questoesSelecionadas = [];

  materias.forEach(mat => {
    const daMateria = bancoQuestoes9Ano.filter(q => q.materia === mat);
    const offset = ((numeroProvaAtual - 1) * 2) % daMateria.length;
    const q1 = daMateria[offset];
    const q2 = daMateria[(offset + 1) % daMateria.length];
    questoesSelecionadas.push(q1, q2);
  });

  respostas = Array(questoesSelecionadas.length).fill(null);
  resultadoRedacaoHTML = '';
  notaRedacao = 0;
  montarProva();
}

function montarProva(){
  salvarTextoRedacao();
  let html='';

  if(modoAtual==='texto'||modoAtual==='ambos'){
    html+=`
      <h3>📝 Redação - Prova ${String(numeroProvaAtual).padStart(2, '0')}</h3>
      <p style="font-weight:bold;color:var(--azul)">Tema: ${temaRedacaoAtual}</p>
      <p class="hint">Regras: Título na 1ª linha | Estrutura de 4 parágrafos | Texto focado e pertinente ao tema proposto.</p>
      <textarea id="textoRedacao" class="textarea-redacao" placeholder="Digite seu título na primeira linha e pule uma linha para o 1º parágrafo..." oninput="salvarTextoRedacao()"></textarea>
      <button class="btn-seta" onclick="corrigirRedacao()">📊 Avaliar Estrutura e Pertinência do Texto</button>
      <div id="resultadoRedacao" style="display:none;margin-top:12px"></div>
      <hr>
    `;
  }
  
  if(modoAtual==='prova'||modoAtual==='ambos'){
    html+=`<h3>❓ Prova Objetiva - Prova ${String(numeroProvaAtual).padStart(2, '0')}</h3>`;
    questoesSelecionadas.forEach((q,i)=>{
      const respAtual = respostas[i] ? respostas[i].letra : '';
      const tipoAtual = respostas[i] ? respostas[i].tipo : 'estudado';

      html+=`
        <div class="questao" id="q${i}">
          <div>
            <span class="tag-banca">${q.banca}</span>
            <span class="tag-materia">${q.materia}</span>
            <span class="tag-serie">${q.serie}</span>
          </div>
          <p><strong>${i+1}. ${q.q}</strong></p>
      `;
      q.ops.forEach((op,idx)=>{
        const letra=['a','b','c','d'][idx];
        const classeSel = (respAtual === letra) ? 'selecionada' : '';
        html+=`<button class="btn-alt ${classeSel}" id="alt${i}${letra}" onclick="selecionar(${i},'${letra}')">${letra}) ${op}</button>`;
      });
      
      const estiloAcoes = respAtual ? 'block' : 'none';
      html+=`
        <div style="margin-top:8px;display:${estiloAcoes}" id="acoes${i}">
          <button class="btn-seta ${tipoAtual==='estudado'?'ativo':''}" id="btnEstudado${i}" onclick="confirmarTipo(${i},'estudado')">Já estudei</button>
          <button class="btn-seta btn-chute ${tipoAtual==='chute'?'ativo':''}" id="btnChute${i}" onclick="confirmarTipo(${i},'chute')">Chute</button>
        </div>
        </div><hr>
      `;
    });
    html+=`<button class="btn-seta" onclick="finalizar()" style="font-size:18px;width:100%">🚀 Finalizar Prova e Gerar Relatório</button>`;
  }
  
  document.getElementById('areaProva').innerHTML = html;

  const elTextarea = document.getElementById('textoRedacao');
  if(elTextarea){
    elTextarea.value = textoRedacaoSalvo;
  }

  if(resultadoRedacaoHTML){
    const elRes = document.getElementById('resultadoRedacao');
    if(elRes){
      elRes.innerHTML = resultadoRedacaoHTML;
      elRes.style.display = 'block';
    }
  }
}

function selecionar(idx, letra){
  const tipoAnterior = (respostas[idx] && respostas[idx].tipo) ? respostas[idx].tipo : 'estudado';
  respostas[idx] = { letra: letra, tipo: tipoAnterior, confirmado: true };
  
  document.querySelectorAll(`#q${idx} .btn-alt`).forEach(b => b.classList.remove('selecionada'));
  const btnSel = document.getElementById(`alt${idx}${letra}`);
  if(btnSel) btnSel.classList.add('selecionada');

  const acoesEl = document.getElementById(`acoes${idx}`);
  if(acoesEl) acoesEl.style.display = 'block';

  confirmarTipo(idx, tipoAnterior);
}

function confirmarTipo(idx, tipo){
  if(!respostas[idx] || !respostas[idx].letra) return alert('Selecione uma alternativa primeiro!');
  respostas[idx].tipo = tipo;

  const btnEstudado = document.getElementById(`btnEstudado${idx}`);
  const btnChute = document.getElementById(`btnChute${idx}`);

  if(btnEstudado && btnChute){
    btnEstudado.classList.remove('ativo');
    btnChute.classList.remove('ativo');

    if(tipo === 'estudado') btnEstudado.classList.add('ativo');
    if(tipo === 'chute') btnChute.classList.add('ativo');
  }
}

// CORREÇÃO LÓGICA DE REDAÇÃO (COM VALIDAÇÃO ANTI-FUGA AO TEMA E ANTI-LIXO)
function corrigirRedacao(){
  salvarTextoRedacao();
  const texto = textoRedacaoSalvo.trim();
  if(texto.length < 20) return alert('A redação precisa ter no mínimo 20 caracteres para avaliação.');
  
  const palavrasChave = palavrasChaveTemas[(numeroProvaAtual - 1) % 15];
  const textoLower = texto.toLowerCase();

  // VALIDAÇÃO 1: DETECÇÃO DE FUGA AO TEMA OU TEXTO COPIADO/LIXO
  const possuiPalavraChave = palavrasChave.some(p => textoLower.includes(p));
  const ehTextoPrompt = textoLower.includes("me ajuda com isso") || textoLower.includes("copiar prompt") || textoLower.includes("gerar pdf");

  if(!possuiPalavraChave || ehTextoPrompt){
    notaRedacao = 0;
    resultadoRedacaoHTML = `
      <div style="background:#ffebee;border:2px solid var(--vermelho);padding:14px;border-radius:8px">
        <h4 style="color:var(--vermelho);margin-top:0">❌ REDAÇÃO REPROVADA: NOTA 0 / 1000 PTS</h4>
        <p style="color:var(--vermelho);font-weight:bold;margin-bottom:0">Fuga ao Tema ou Texto Incompatível!</p>
        <p style="font-size:13px;color:#333;margin-top:6px">O texto digitado não apresenta nenhuma relação com o tema proposto (<strong>"${temaRedacaoAtual}"</strong>) ou contém comandos/rascunhos desconexos. Escreva uma redação original focada no assunto sugerido.</p>
      </div>
    `;
    const elRes = document.getElementById('resultadoRedacao');
    if(elRes){
      elRes.innerHTML = resultadoRedacaoHTML;
      elRes.style.display = 'block';
    }
    return;
  }

  // VALIDAÇÃO 2: ESTRUTURA FORMAL (QUANDO O TEMA É VÁLIDO)
  const linhas = texto.split('\n').filter(l => l.trim().length > 0);
  const palavras = texto.split(/\s+/).length;
  const paragrafos = texto.split(/\n\s*\n/).filter(p => p.trim().length > 0);
  const conectivos = (texto.match(/portanto|assim|além disso|contudo|porém|em suma|logo|dessa forma/gi) || []).length;
  
  let nota = 0;
  let detalhes = [];

  if(linhas.length > 1 && linhas[0].length < 70){
    nota += 200;
    detalhes.push("✅ Título destacado na 1ª linha alinhado ao tema.");
  } else {
    detalhes.push("⚠️ Faltou um título curto na primeira linha.");
  }

  if(paragrafos.length >= 4){
    nota += 300;
    detalhes.push("✅ Estrutura completa de 4 parágrafos (Introdução, D1, D2, Conclusão).");
  } else {
    nota += paragrafos.length * 60;
    detalhes.push(`⚠️ Encontrados ${paragrafos.length} parágrafos. A estrutura padrão exige 4.`);
  }

  if(palavras >= 150 && palavras <= 300){
    nota += 300;
    detalhes.push(`✅ Extensão adequada (${palavras} palavras). Média de 4 a 5 linhas por parágrafo.`);
  } else if(palavras < 150){
    nota += Math.round((palavras / 150) * 200);
    detalhes.push(`⚠️ Texto curto (${palavras} palavras). O mínimo recomendado é de 150 palavras.`);
  } else {
    nota += 200;
    detalhes.push(`⚠️ Texto longo (${palavras} palavras). Mantenha o limite de 300 palavras.`);
  }

  if(conectivos >= 3){
    nota += 200;
    detalhes.push(`✅ Uso de conectivos de coesão (${conectivos} encontrados).`);
  } else {
    nota += conectivos * 60;
    detalhes.push("⚠️ Poucos conectivos identificados ('portanto', 'além disso', 'dessa forma').");
  }

  notaRedacao = Math.min(1000, nota);

  resultadoRedacaoHTML = `
    <h4>📊 Nota Estrutural da Redação: ${notaRedacao} / 1000 pts</h4>
    <div style="font-size:14px;line-height:1.6">${detalhes.join('<br>')}</div>
  `;
  const elRes = document.getElementById('resultadoRedacao');
  if(elRes){
    elRes.innerHTML = resultadoRedacaoHTML;
    elRes.style.display = 'block';
  }
}

function finalizar(){
  salvarTextoRedacao();
  let acertosTotal = 0;
  let acertosConhecimento = 0;
  let acertosChute = 0;
  let respondidas = 0;
  let errosMapeados = [];
  let htmlGabaritoComentado = `<h3>💡 Gabarito Comentado e Correção</h3>`;

  respostas.forEach((r, i) => {
    const q = questoesSelecionadas[i];
    if(r && r.letra){
      respondidas++;
      const acertou = (r.letra === q.gab);
      if(acertou){
        acertosTotal++;
        if(r.tipo === 'chute') acertosChute++;
        else acertosConhecimento++;
      } else {
        errosMapeados.push({ num: i + 1, materia: q.materia, topico: q.topico, serie: q.serie, tipo: r.tipo });
      }

      const classeBox = acertou ? "acerto" : "erro";
      const icone = acertou ? (r.tipo === 'chute' ? "🍀 ACERTOU NO CHUTE" : "✅ ACERTOU") : "❌ ERROU";

      htmlGabaritoComentado += `
        <div class="box-gabarito ${classeBox}">
          <strong>Questão ${i+1} (${q.materia} - ${q.serie}):</strong> ${icone}<br>
          <em>Conteúdo:</em> ${q.topico}<br>
          <em>Sua resposta:</em> Opção ${r.letra.toUpperCase()} (${r.tipo === 'chute' ? 'Marcado como Chute' : 'Já Estudado'}) | <em>Gabarito:</em> Opção ${q.gab.toUpperCase()}<br>
          <div style="margin-top:6px"><strong>Explicação:</strong> ${q.explicacao}</div>
        </div>
      `;
    }
  });

  if(modoAtual !== 'texto' && respondidas < questoesSelecionadas.length){
    return alert(`Responda todas as ${questoesSelecionadas.length} questões antes de finalizar!`);
  }

  const notaQ = Math.round((acertosTotal / questoesSelecionadas.length) * 1000);
  const notaFinalGeral = Math.round((notaQ + notaRedacao) / 2);
  const percentualMeta = Math.min(100, Math.round((notaFinalGeral / META_FIXA) * 100));

  let htmlPlanoEstudo = '';
  if(errosMapeados.length > 0 || acertosChute > 0){
    htmlPlanoEstudo = `
      <div class="box-estudo">
        <h4>📌 Diagnóstico Pedagógico de Desempenho:</h4>
        <p><strong>Domínio Real:</strong> ${acertosConhecimento} acertos por conhecimento pleno | <strong>Sorte:</strong> ${acertosChute} acertos por chute.</p>
        <ul>
    `;
    errosMapeados.forEach(e => {
      htmlPlanoEstudo += `<li>❌ <strong>Erro na Questão ${e.num} (${e.materia}):</strong> Assunto <em>${e.topico}</em> (Estudado na ${e.serie} do EF).</li>`;
    });
    if(acertosChute > 0){
      htmlPlanoEstudo += `<li style="color:#d35400">⚠️ <strong>Atenção para Acertos por Chute:</strong> Você acertou ${acertosChute} questão(ões) no chute. Revise esses tópicos no gabarito comentado abaixo!</li>`;
    }
    htmlPlanoEstudo += `</ul></div>`;
  } else {
    htmlPlanoEstudo = `<div class="box-estudo" style="border-color:var(--verde)">🎉 Excelente! Você gabaritou todas as questões com total domínio do conteúdo!</div>`;
  }

  // FORMATANDO O RELATÓRIO DO WHATSAPP COM AUDITORIA DE "JÁ ESTUDEI" E "CHUTE"
  relatorioWhatsAppTexto = `*SIMULADO PREPARATÓRIO CEDAF / COLTEC / IF*\n` +
    `*Aluno:* ${userLogin}\n` +
    `*Prova:* Prova ${String(numeroProvaAtual).padStart(2, '0')}\n` +
    `*Nota Final Média:* ${notaFinalGeral}/1000 pts\n` +
    `*Nota Objetiva:* ${notaQ}/1000 (${acertosTotal}/${questoesSelecionadas.length} acertos)\n` +
    `  • Acertos por Conhecimento: ${acertosConhecimento}\n` +
    `  • Acertos por Chute (Sorte): ${acertosChute}\n` +
    `*Nota Redação:* ${notaRedacao}/1000\n` +
    `*Chance de Sucesso:* ${percentualMeta}%\n\n`;

  if(errosMapeados.length > 0){
    relatorioWhatsAppTexto += `*Assuntos para Reforço e Estudo:*\n`;
    errosMapeados.forEach(e => {
      relatorioWhatsAppTexto += `• ${e.materia} (${e.serie}): ${e.topico}\n`;
    });
  }

  let htmlResultado = `
    <h3>📊 Relatório Final - Prova ${String(numeroProvaAtual).padStart(2, '0')}</h3>
    <h2>Nota Média Final: ${notaFinalGeral} / 1000 pts (Meta Fixa: ${META_FIXA})</h2>
    <p><strong>Nota Objetiva:</strong> ${notaQ}/1000 (${acertosTotal}/${questoesSelecionadas.length} acertos)</p>
    <p><strong>Nota Redação:</strong> ${notaRedacao}/1000</p>
    
    <div class="chance-box ${percentualMeta >= 80 ? 'chance-alta' : 'chance-baixa'}">
      🎯 CHANCE DE SUCESSO NA REVISÃO FINAL: ${percentualMeta}%
    </div>

    ${htmlPlanoEstudo}
    <hr>
    ${htmlGabaritoComentado}
  `;

  htmlResultado += `
    <hr>
    <div id="statusEnvio" style="font-weight:bold;color:var(--verde);margin-bottom:16px">⏳ Enviando dados para a planilha CEDAF...</div>
    
    <button class="btn-whats" onclick="enviarWhatsApp()">📱 Enviar Relatório via WhatsApp para Liberar Próxima Prova</button>
    
    <button id="btnProximaProva" class="btn-seta" style="font-size:16px;width:100%;padding:14px;background:var(--azul)" disabled onclick="avancarParaProximaProva()">🔒 Envie o Relatório via WhatsApp para Liberar a Próxima Prova</button>
  `;
  
  document.getElementById('resultadoFinal').innerHTML = htmlResultado;
  document.getElementById('resultadoFinal').style.display = 'block';
  document.getElementById('areaProva').style.display = 'none';

  const telClean = userTelefone.replace(/\D/g, "");
  const progressoAlunos = JSON.parse(localStorage.getItem('progresso_provas') || '{}');
  progressoAlunos[telClean] = (progressoAlunos[telClean] || 0) + 1;
  localStorage.setItem('progresso_provas', JSON.stringify(progressoAlunos));

  enviarDadosAutomatico(notaQ, acertosTotal);
}

function enviarWhatsApp(){
  if(!relatorioWhatsAppTexto) return;
  const urlWa = `https://wa.me/?text=${encodeURIComponent(relatorioWhatsAppTexto)}`;
  window.open(urlWa, '_blank');

  const btnProx = document.getElementById('btnProximaProva');
  if(btnProx){
    btnProx.disabled = false;
    btnProx.innerHTML = `🎲 Fazer Próxima Prova (Prova ${String((numeroProvaAtual % 15) + 1).padStart(2, '0')})`;
  }
}

function avancarParaProximaProva(){
  const telClean = userTelefone.replace(/\D/g, "");
  const progressoAlunos = JSON.parse(localStorage.getItem('progresso_provas') || '{}');
  let qtdFeitas = progressoAlunos[telClean] || 0;
  numeroProvaAtual = (qtdFeitas % 15) + 1;

  // LIMPEZA GARANTIDA DO CAMPO DE REDAÇÃO PARA A NOVA PROVA
  textoRedacaoSalvo = '';
  limparRascunhoRedacao();

  document.getElementById('exibirIdentificadorProva').textContent = `Prova ${String(numeroProvaAtual).padStart(2, '0')}`;
  document.getElementById('resultadoFinal').style.display = 'none';
  document.getElementById('areaProva').style.display = 'block';

  gerarProvaSequencial();
}

function enviarDadosAutomatico(notaQ, acertosTotal){
  const agora = new Date();
  const tempoTotalMinutos = Math.max(1, Math.round((agora - tempoInicioApp) / 60000));
  const telClean = userTelefone.replace(/\D/g, "");
  const textoEscrito = textoRedacaoSalvo || "Redação não realizada nesta tentativa.";
  
  const chaveUnicaAluno = userLogin + "_" + telClean;

  const payload = {
    login: chaveUnicaAluno,
    data: agora.toLocaleDateString('pt-BR'),
    hora: agora.toLocaleTimeString('pt-BR'),
    prova: `Prova ${String(numeroProvaAtual).padStart(2, '0')}`,
    tema: temaRedacaoAtual,
    notaProva: notaQ,
    notaRedacao: notaRedacao,
    acertos: acertosTotal,
    tempoMinutos: tempoTotalMinutos,
    objetivoMeta: META_FIXA,
    textoRedacao: textoEscrito
  };

  fetch(URL_CEDAF, {
    method: 'POST',
    mode: 'no-cors',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  }).then(() => {
    document.getElementById('statusEnvio').innerHTML = "✅ Dados e redação registrados com sucesso na planilha CEDAF!";
    limparRascunhoRedacao();
  }).catch(err => {
    document.getElementById('statusEnvio').innerHTML = "❌ Erro ao registrar dados. Tente novamente.";
  });
}
</script>
