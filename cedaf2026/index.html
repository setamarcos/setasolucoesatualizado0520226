.erro-msg{color:var(--vermelho);font-size:13px;font-weight:bold;display:none;margin-top:4px}
.badge-meta{background:#fff3e0;color:var(--laranja);padding:6px 12px;border-radius:20px;font-weight:bold;display:inline-block;margin:8px 0}
.chance-box{padding:16px;border-radius:8px;text-align:center;font-size:18px;font-weight:bold;margin:16px 0}
.chance-alta{background:#e6f4ea;color:var(--verde);border:2px solid var(--verde)}
.chance-media{background:#fff3e0;color:var(--laranja);border:2px solid var(--laranja)}

let modoAtual='ambos';
let questoesSelecionadas=[];
let respostas=[];
let resultadoRedacaoHTML='';
let notaRedacao=0;

function aplicarMascaraTelefone(input){
  let v = input.value.replace(/\D/g, "");
  if(v.length > 11) v = v.slice(0, 11);
  if(v.length > 2){
    v = "(" + v.substring(0,2) + ") " + v.substring(2);
  }
  if(v.length > 9){
    v = v.substring(0,10) + "-" + v.substring(10);
  }
  input.value = v;
}

function validarTelefoneBR(tel){
  const regex = /^\(\d{2}\)\s9\d{4}-\d{4}$/;
  return regex.test(tel);
}

function validarELogar(){
  const nome = document.getElementById('inputNome').value.trim();
  const tel = document.getElementById('inputTelefone').value.trim();
  const errBox = document.getElementById('msgErro');

  if(!nome || nome.length < 3){
    alert("Informe o nome completo do aluno.");
    return;
  }

  if(!validarTelefoneBR(tel)){
    errBox.style.display = 'block';
    return;
  }

  errBox.style.display = 'none';
  userLogin = nome;
  userTelefone = tel;
  tempoInicioApp = new Date();

  // Seleciona 1 tema de redação aleatório
  temaRedacaoAtual = bancoTemasRedacao[Math.floor(Math.random() * bancoTemasRedacao.length)];

  document.getElementById('loginModal').style.display = 'none';
  document.getElementById('areaAplicacao').style.display = 'block';

  document.getElementById('exibirNomeAluno').textContent = userLogin;
  document.getElementById('exibirTelefone').textContent = userTelefone;

  gerarProvaEquilibrada();
}

function modo(m){
  modoAtual=m;
  document.querySelectorAll('.btn-topo').forEach(b=>b.classList.remove('ativo'));
  document.getElementById(`btn${m.charAt(0).toUpperCase()+m.slice(1)}`).classList.add('ativo');
  montarProva();
}

function gerarProvaEquilibrada(){
  // Seleciona 2 questões de cada matéria para compor as 10 questões da prova
  const materias = ["Português", "Matemática", "Ciências", "História", "Geografia"];
  questoesSelecionadas = [];

  materias.forEach(mat => {
    const daMateria = bancoQuestoes9Ano.filter(q => q.materia === mat);
    const sorteadas = [...daMateria].sort(() => Math.random() - 0.5).slice(0, 2);
    questoesSelecionadas.push(...sorteadas);
  });

  questoesSelecionadas.sort(() => Math.random() - 0.5);
  respostas = Array(10).fill(null);
  montarProva();
}

function montarProva(){
  let html='';
  if(modoAtual==='texto'||modoAtual==='ambos'){
    html+=`
      <h3>📝 Redação - Tema: ${temaRedacaoAtual}</h3>
      <p><strong>Instruções:</strong> Redija um texto dissertativo-argumentativo apresentando tese e proposta de intervenção.</p>
      <textarea id="textoRedacao" class="textarea-redacao" placeholder="Desenvolva sua redação aqui..."></textarea>
      <button class="btn-seta" onclick="corrigirRedacao()">📊 Avaliar Redação</button>
      <div id="resultadoRedacao" style="display:none;margin-top:12px"></div>
      <hr>
    `;
  }
  
  if(modoAtual==='prova'||modoAtual==='ambos'){
    html+=`<h3>❓ Prova Objetiva 9º Ano (10 Questões)</h3>`;
    questoesSelecionadas.forEach((q,i)=>{
      html+=`
        <div class="questao" id="q${i}">
          <div>
            <span class="tag-banca">${q.banca}</span>
            <span class="tag-materia">${q.materia}</span>
          </div>
          <p><strong>${i+1}. ${q.q}</strong></p>
      `;
      q.ops.forEach((op,idx)=>{
        const letra=['a','b','c','d'][idx];
        html+=`<button class="btn-alt" id="alt${i}${letra}" onclick="selecionar(${i},'${letra}')">${letra}) ${op}</button>`;
      });
      html+=`
        <div style="margin-top:8px;display:none" id="acoes${i}">
          <button class="btn-seta" onclick="confirmar(${i},'estudado')">Já estudei</button>
          <button class="btn-seta btn-chute" onclick="confirmar(${i},'chute')">Chute</button>
        </div>
        </div><hr>
      `;
    });
    html+=`<button class="btn-seta" onclick="finalizar()" style="font-size:18px;width:100%">🚀 Finalizar Prova e Enviar Dados</button>`;
  }
  
  document.getElementById('areaProva').innerHTML=html;
}

function selecionar(idx,letra){
  if(respostas[idx]&&respostas[idx].confirmado)return;
  document.querySelectorAll(`#q${idx} .btn-alt`).forEach(b=>b.classList.remove('selecionada'));
  document.getElementById(`alt${idx}${letra}`).classList.add('selecionada');
  respostas[idx]={letra,tipo:null,confirmado:false};
  document.getElementById(`acoes${idx}`).style.display='block';
}

function confirmar(idx,tipo){
  if(!respostas[idx]||!respostas[idx].letra)return alert('Marque uma alternativa!');
  respostas[idx].tipo=tipo;
  respostas[idx].confirmado=true;
  document.getElementById(`acoes${idx}`).style.display='none';
  document.querySelectorAll(`#q${idx} .btn-alt`).forEach(b=>b.classList.add('travada'));
  document.getElementById(`q${idx}`).classList.add('questao-travada');
}

function corrigirRedacao(){
  const texto=document.getElementById('textoRedacao').value;
  if(texto.trim().length<20)return alert('A redação precisa ter no mínimo 20 caracteres.');
  
  const palavras=texto.trim().split(/\s+/).length;
  notaRedacao = Math.min(1000, Math.max(450, palavras * 7.5));
  
  resultadoRedacaoHTML=`
    <h4>Nota da Redação: ${notaRedacao}/1000</h4>
    <p class="hint">Volume textual: ${palavras} palavras</p>
  `;
  document.getElementById('resultadoRedacao').innerHTML=resultadoRedacaoHTML;
  document.getElementById('resultadoRedacao').style.display='block';
}

function finalizar(){
  let acertosTotal=0;
  let respondidas=0;

  respostas.forEach((r,i)=>{
    if(r && r.confirmado){
      respondidas++;
      if(r.letra === questoesSelecionadas[i].gab) acertosTotal++;
    }
  });

  if(modoAtual !== 'texto' && respondidas === 0){
    return alert('Responda e confirme ao menos uma questão antes de finalizar!');
  }

  const notaQ = Math.round((acertosTotal/10)*1000);
  const notaFinalGeral = Math.round((notaQ + notaRedacao) / 2);
  
  // CHANCE DE SUCESSO NA REVISÃO FINAL (MÉDIA CRAVADA EM 900)
  const percentualMeta = Math.min(100, Math.round((notaFinalGeral / META_FIXA) * 100));
  let classeChance = "chance-baixa";
  let statusChance = "Risco Alto - Necessita reforço imediato";

  if(percentualMeta >= 95){
    classeChance = "chance-alta";
    statusChance = "Excelente! Altíssima probabilidade de aprovação na revisão final";
  } else if(percentualMeta >= 80){
    classeChance = "chance-media";
    statusChance = "Boa! Probabilidade média de aprovação, ajuste os pontos fracos";
  }

  let htmlResultado = `
    <h3>📊 Relatório Final do Simulado</h3>
    <h2>Nota Média Final: ${notaFinalGeral} / 1000 pts (Meta Fixa: ${META_FIXA})</h2>
    <p><strong>Nota Objetiva:</strong> ${notaQ}/1000 (${acertosTotal}/10 acertos)</p>
    <p><strong>Nota Redação:</strong> ${notaRedacao}/1000</p>
    
    <div class="chance-box ${classeChance}">
      🎯 CHANCE DE SUCESSO NA REVISÃO FINAL: ${percentualMeta}%<br>
      <span style="font-size:14px;font-weight:normal">${statusChance}</span>
    </div>
  `;

  if(resultadoRedacaoHTML){
    htmlResultado += `<hr>${resultadoRedacaoHTML}`;
  }

  htmlResultado += `<div id="statusEnvio" style="font-weight:bold;color:var(--verde)">⏳ Enviando automaticamente para o sistema...</div>`;
  
  document.getElementById('resultadoFinal').innerHTML = htmlResultado;
  document.getElementById('resultadoFinal').style.display = 'block';
  document.getElementById('areaProva').style.display = 'none';

  enviarDadosAutomatico(notaQ, acertosTotal);
}

function enviarDadosAutomatico(notaQ, acertosTotal){
  const agora = new Date();
  const tempoTotalMinutos = Math.max(1, Math.round((agora - tempoInicioApp) / 60000));
  
  const payload = {
    login: userLogin + "_" + userTelefone.replace(/\D/g, ""),
    data: agora.toLocaleDateString('pt-BR'),
    hora: agora.toLocaleTimeString('pt-BR'),
    prova: "Simulado_9Ano_2026",
    tema: temaRedacaoAtual,
    notaProva: notaQ,
    notaRedacao: notaRedacao,
    acertos: acertosTotal,
    tempoMinutos: tempoTotalMinutos,
    objetivoMeta: META_FIXA
  };

  fetch(URL_CEDAF, {
    method: 'POST',
    mode: 'no-cors',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  }).then(() => {
    document.getElementById('statusEnvio').innerHTML = "✅ Dados registrados com sucesso na planilha CEDAF!";
  }).catch(err => {
    document.getElementById('statusEnvio').innerHTML = "❌ Erro ao registrar dados. Tente novamente.";
  });
}
</script>
