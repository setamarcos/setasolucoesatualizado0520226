<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seta Soluções - ENEM 2026</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #2563eb;
      --accent-green: #22c55e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 20px; }

    .header-logo { text-align: center; margin-bottom: 20px; }
    .header-logo img { max-width: 320px; height: auto; border-radius: 8px; background: #fff; padding: 10px; }
    .slogan { font-size: 1.2rem; color: var(--accent-green); font-weight: 600; margin-top: 10px; }
    .datetime-bar { text-align: center; font-size: 0.95rem; color: #60a5fa; margin-top: 8px; font-weight: bold; }

    .container { max-width: 900px; margin: 20px auto; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { text-align: center; margin-bottom: 20px; font-size: 1.5rem; color: #fff; }

    .grid-users, .grid-provas { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; margin-top: 20px; }
    
    .btn { background: var(--accent-blue); color: white; border: none; padding: 16px 20px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: all 0.2s ease; text-align: center; }
    .btn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.2); }
    .btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; border: 1px dashed #475569; }

    .btn-user { background: #334155; border: 2px solid #475569; }

    .timer-bar { display: flex; justify-content: space-between; align-items: center; background: #0284c7; padding: 12px 20px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; margin-bottom: 20px; }

    .question-box { background: #0f172a; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #334155; }
    .question-enunciado { font-size: 1.05rem; line-height: 1.6; margin-bottom: 15px; white-space: pre-wrap; }
    .question-img { max-width: 100%; height: auto; border-radius: 6px; margin: 15px 0; display: block; }

    .options-group { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
    .option-btn { background: #1e293b; border: 1px solid #334155; padding: 12px 15px; border-radius: 6px; color: #fff; text-align: left; cursor: pointer; display: flex; gap: 10px; font-size: 0.95rem; }
    .option-btn.selected { background: var(--accent-blue); border-color: #60a5fa; }

    .nav-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="header-logo">
    <img src="https://raw.githubusercontent.com/setamarcos/setasolucoesatualizado0520226/main/img/logo2.png" alt="Seta Soluções">
    <div class="slogan">Família que estuda junta, vence junta!</div>
    <div class="datetime-bar" id="live-datetime">Carregando data e hora...</div>
  </div>

  <div class="container">
    
    <!-- TELA 1: SELEÇÃO DE USUÁRIO -->
    <div id="screen-user">
      <h2>Quem está estudando agora?</h2>
      <div class="grid-users">
        <button class="btn btn-user" onclick="selectUser('Marcos')">Marcos (Pai / Gestor)</button>
        <button class="btn btn-user" onclick="selectUser('Verônica')">Verônica (Mãe / Professora)</button>
        <button class="btn btn-user" onclick="selectUser('Yasmin')">Yasmin (Estudante ENEM)</button>
      </div>
    </div>

    <!-- TELA 2: SELEÇÃO DE PROVA SEQUENCIAL -->
    <div id="screen-prova" class="hidden">
      <h2>Cronograma de Provas do ENEM</h2>
      <p style="text-align: center; color: var(--text-muted);" id="user-welcome"></p>
      
      <div class="grid-provas" style="margin-top: 25px;">
        <button class="btn" id="btn-p1" onclick="iniciarProva(2022)">
          1ª Prova: ENEM 2022 (180 Q)
        </button>
        <button class="btn" id="btn-p2" onclick="iniciarProva(2023)" disabled>
          🔒 2ª Prova: ENEM 2023 (Bloqueada)
        </button>
        <button class="btn" id="btn-p3" onclick="iniciarProva(2024)" disabled>
          🔒 3ª Prova: ENEM 2024 (Bloqueada)
        </button>
      </div>
    </div>

    <!-- TELA 3: EXECUTANDO PROVA -->
    <div id="screen-quiz" class="hidden">
      <div class="timer-bar">
        <span>Questão <span id="q-curr">1</span> de <span id="q-total">180</span></span>
        <span>Tempo: <span id="timer">00:00:00</span></span>
      </div>

      <div class="question-box">
        <div class="question-enunciado" id="q-enunciado">Carregando questões do servidor...</div>
        <img id="q-img" class="question-img hidden" src="" alt="Imagem da questão">
        
        <div class="options-group" id="options-container"></div>
      </div>

      <div class="nav-controls">
        <button class="btn" style="background:#475569" onclick="prevQuestion()">Anterior</button>
        <button class="btn" style="background:var(--accent-green)" onclick="finalizarProva()">Finalizar Prova</button>
        <button class="btn" onclick="nextQuestion()">Próxima</button>
      </div>
    </div>

    <!-- TELA 4: RESULTADO -->
    <div id="screen-result" class="hidden" style="text-align: center;">
      <h2>Simulado Concluído com Sucesso!</h2>
      <p style="font-size: 1.2rem; margin: 20px 0;">Estudante: <strong id="res-user"></strong></p>
      <p style="font-size: 1.6rem; color: var(--accent-green); margin-bottom: 15px;">
        Aproveitamento: <span id="res-score"></span>%
      </p>
      <p style="color: var(--text-muted); margin-bottom: 25px;">Tempo total registrado: <span id="res-time"></span></p>
      <button class="btn" onclick="proximaEtapa()">Continuar Cronograma</button>
    </div>

  </div>

  <script>
    // IMPORTANTE: Cole abaixo o link gerado pela sua WebApp do Google Apps Script
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxPM_vfxyPUxwB4Thd2CYI2VR4dYA-ODcAvTg0w9UcKMGMG2qt0ZggVwwfumb016YjF/exec";

    let currentUser = '';
    let currentAno = 2022;
    let questions = [];
    let currentIndex = 0;
    let answers = {};
    let timerInterval = null;
    let secondsElapsed = 0;

    function updateDateTime() {
      const now = new Date();
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
      document.getElementById('live-datetime').innerText = now.toLocaleDateString('pt-BR', options);
    }
    setInterval(updateDateTime, 1000);
    updateDateTime();

    function selectUser(user) {
      currentUser = user;
      document.getElementById('user-welcome').innerText = 'Estudante ativo: ' + user;
      document.getElementById('screen-user').classList.add('hidden');
      document.getElementById('screen-prova').classList.remove('hidden');
      atualizarBotoesProvas();
    }

    function atualizarBotoesProvas() {
      const p1Done = localStorage.getItem(currentUser + '_2022_done');
      const p2Done = localStorage.getItem(currentUser + '_2023_done');

      const btnP2 = document.getElementById('btn-p2');
      const btnP3 = document.getElementById('btn-p3');

      if (p1Done) {
        btnP2.disabled = false;
        btnP2.innerText = '2ª Prova: ENEM 2023 (180 Q)';
      }
      if (p2Done) {
        btnP3.disabled = false;
        btnP3.innerText = '3ª Prova: ENEM 2024 (180 Q)';
      }
    }

    function iniciarProva(ano) {
      currentAno = ano;
      document.getElementById('screen-prova').classList.add('hidden');
      document.getElementById('screen-quiz').classList.remove('hidden');
      
      secondsElapsed = 0;
      answers = {};
      startTimer();

      // Busca na nuvem (Suporta tanto GitHub Pages via fetch quanto Apps Script via google.script.run)
      if (typeof google !== 'undefined' && google.script) {
        google.script.run
          .withSuccessHandler(renderQuestions)
          .getQuestoesProva(ano);
      } else {
        fetch(`${WEB_APP_URL}?action=getQuestoes&ano=${ano}`)
          .then(response => response.json())
          .then(data => renderQuestions(data))
          .catch(err => {
            document.getElementById('q-enunciado').innerText = 'Erro ao conectar ao banco de questões na nuvem. Verifique a URL do WebApp.';
          });
      }
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const h = String(Math.floor(secondsElapsed / 3600)).padStart(2, '0');
        const m = String(Math.floor((secondsElapsed % 3600) / 60)).padStart(2, '0');
        const s = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timer').innerText = `${h}:${m}:${s}`;
      }, 1000);
    }

    function renderQuestions(data) {
      if (!data || data.length === 0) {
        document.getElementById('q-enunciado').innerText = 'Nenhuma questão encontrada para a prova selecionada.';
        return;
      }
      questions = data;
      document.getElementById('q-total').innerText = questions.length;
      showQuestion(0);
    }

    function showQuestion(index) {
      currentIndex = index;
      const q = questions[index];
      document.getElementById('q-curr').innerText = index + 1;
      document.getElementById('q-enunciado').innerText = q.enunciado;

      const imgElem = document.getElementById('q-img');
      if (q.imagem && q.imagem.length > 5) {
        imgElem.src = q.imagem;
        imgElem.classList.remove('hidden');
      } else {
        imgElem.classList.add('hidden');
      }

      const optsContainer = document.getElementById('options-container');
      optsContainer.innerHTML = '';

      const opts = [
        { key: 'A', text: q.optA },
        { key: 'B', text: q.optB },
        { key: 'C', text: q.optC },
        { key: 'D', text: q.optD },
        { key: 'E', text: q.optE }
      ];

      opts.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn' + (answers[index] === opt.key ? ' selected' : '');
        btn.innerHTML = `<strong>${opt.key})</strong> ${opt.text}`;
        btn.onclick = () => {
          answers[index] = opt.key;
          showQuestion(index);
        };
        optsContainer.appendChild(btn);
      });
    }

    function nextQuestion() {
      if (currentIndex < questions.length - 1) showQuestion(currentIndex + 1);
    }

    function prevQuestion() {
      if (currentIndex > 0) showQuestion(currentIndex - 1);
    }

    function finalizarProva() {
      clearInterval(timerInterval);
      let acertos = 0;
      questions.forEach((q, idx) => {
        if (answers[idx] === q.gabarito) acertos++;
      });

      const total = questions.length;
      const percentual = ((acertos / total) * 100).toFixed(1);

      localStorage.setItem(currentUser + '_' + currentAno + '_done', 'true');

      document.getElementById('screen-quiz').classList.add('hidden');
      document.getElementById('screen-result').classList.remove('hidden');
      document.getElementById('res-user').innerText = currentUser;
      document.getElementById('res-score').innerText = percentual;
      document.getElementById('res-time').innerText = document.getElementById('timer').innerText;

      // Salva os resultados no Google Sheets
      if (typeof google !== 'undefined' && google.script) {
        google.script.run.salvarResultado(currentUser, currentAno, acertos, total, secondsElapsed);
      } else {
        fetch(`${WEB_APP_URL}?action=salvarResultado&usuario=${encodeURIComponent(currentUser)}&ano=${currentAno}&acertos=${acertos}&total=${total}&tempo=${secondsElapsed}`);
      }
    }

    function proximaEtapa() {
      document.getElementById('screen-result').classList.add('hidden');
      document.getElementById('screen-prova').classList.remove('hidden');
      atualizarBotoesProvas();
    }
  </script>
</body>
</html>
