function atualizarDataHora(){
  const agora = new Date();
  const dataStr = agora.toLocaleDateString('pt-BR');
  const horaStr = agora.toLocaleTimeString('pt-BR');
  const el = document.getElementById('exibirDataHora');
  if(el) el.textContent = `📅 ${dataStr}  |  ⏰ ${horaStr}`;
}
setInterval(atualizarDataHora, 1000);

function iniciarTimerTreino(){
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    tempoRestanteSegundos--;
    const min = Math.floor(tempoRestanteSegundos / 60);
    const seg = tempoRestanteSegundos % 60;
    const txtMin = String(min).padStart(2, '0');
    const txtSeg = String(seg).padStart(2, '0');
    
    const elTimer = document.getElementById('caixaTimer');
    if(elTimer) elTimer.textContent = `⏳ Tempo de Treino: ${txtMin}:${txtSeg}`;

    if(tempoRestanteSegundos <= 0){
      clearInterval(timerInterval);
      alert("⏱️ Tempo limite de treino atingido (1 hora). Sua sessão foi encerrada para descansar a mente!");
      location.reload();
    }
  }, 1000);
}

function verificarTravaRotina(){
  const hoje = new Date();
  const diaSemana = hoje.getDay();
  const banner = document.getElementById('bannerRotina');
  const ctrlFimSemana = document.getElementById('controlesModoFimSemana');

  if(diaSemana === 1 || diaSemana === 3 || diaSemana === 5){
    modoDiaSemana = 'prova';
    modoAtual = 'prova';
    if(banner) banner.innerHTML = `📝 ROTINA DIÁRIA: Hoje é Dia de PROVA OBJETIVA (10 Questões)<br><small style="font-weight:normal">Foco em fixar conteúdos e raciocínio lógico.</small>`;
    if(ctrlFimSemana) ctrlFimSemana.style.display = 'none';
  } else if(diaSemana === 2 || diaSemana === 4){
    modoDiaSemana = 'texto';
    modoAtual = 'texto';
    if(banner) banner.innerHTML = `✍️ ROTINA DIÁRIA: Hoje é Dia de REDAÇÃO GUIADA & REPERTÓRIO<br><small style="font-weight:normal">Foco em construir ideias e treinar na Folha Pautada A4.</small>`;
    if(ctrlFimSemana) ctrlFimSemana.style.display = 'none';
  } else {
    modoDiaSemana = 'ambos';
    modoAtual = 'ambos';
    if(banner) banner.innerHTML = `🎯 FIM DE SEMANA: Modo Treino Livre Habilitado`;
    if(ctrlFimSemana) ctrlFimSemana.style.display = 'block';
  }
}

function aoDigitarTelefone(input){
  let v = input.value.replace(/\D/g, "");
  if(v.length > 11) v = v.slice(0, 11);
  if(v.length > 2) v = "(" + v.substring(0,2) + ") " + v.substring(2);
  if(v.length > 9) v = v.substring(0,10) + "-" + v.substring(10);
  input.value = v;

  const telClean = v.replace(/\D/g, "");
  if(telClean.length === 11){
    const alunosSalvos = JSON.parse(localStorage.getItem('alunos_registrados') || '{}');
    if(alunosSalvos[telClean]){
      document.getElementById('inputNome').value = alunosSalvos[telClean];
      document.getElementById('inputNome').readOnly = true;
    } else {
      document.getElementById('inputNome').readOnly = false;
    }
  }
}

function validarELogar(){
  const nomeInput = document.getElementById('inputNome').value.trim();
  const telInput = document.getElementById('inputTelefone').value.trim();
  const telClean = telInput.replace(/\D/g, "");
  const errBox = document.getElementById('msgErro');

  if(telClean.length !== 11){
    errBox.style.display = 'block';
    errBox.textContent = "⚠️ Insira um número de telefone celular válido com DDD.";
    return;
  }

  if(!nomeInput || nomeInput.length < 3){
    errBox.style.display = 'block';
    errBox.textContent = "⚠️ Por favor, preencha o nome do aluno.";
    return;
  }

  const alunosSalvos = JSON.parse(localStorage.getItem('alunos_registrados') || '{}');
  if(alunosSalvos[telClean] && alunosSalvos[telClean].toLowerCase() !== nomeInput.toLowerCase()){
    errBox.style.display = 'block';
    errBox.textContent = `⚠️ Este telefone já pertence ao aluno "${alunosSalvos[telClean]}".`;
    return;
  }

  alunosSalvos[telClean] = nomeInput;
  localStorage.setItem('alunos_registrados', JSON.stringify(alunosSalvos));

  errBox.style.display = 'none';
  userLogin = nomeInput;
  userTelefone = telInput;
  tempoInicioApp = new Date();

  const progressoAlunos = JSON.parse(localStorage.getItem('progresso_provas') || '{}');
  let qtdFeitas = progressoAlunos[telClean] || 0;
  numeroProvaAtual = (qtdFeitas % 15) + 1;

  document.getElementById('loginModal').style.display = 'none';
  document.getElementById('areaAplicacao').style.display = 'block';

  document.getElementById('exibirNomeAluno').textContent = userLogin;
  document.getElementById('exibirTelefone').textContent = userTelefone;
  document.getElementById('exibirIdentificadorProva').textContent = `Prova ${String(numeroProvaAtual).padStart(2, '0')}`;

  verificarTravaRotina();
  iniciarTimerTreino();
  atualizarDataHora();
  gerarProvaSequencial();
}

  questoesSelecionadas = [];

  materias.forEach(mat => {
    const daMateria = bancoQuestoes9Ano.filter(q => q.materia === mat);
    const offset = ((numeroProvaAtual - 1) * 2) % daMateria.length;
    const q1 = daMateria[offset];
    const q2 = daMateria[(offset + 1) % daMateria.length];
    questoesSelecionadas.push(q1, q2);
  });

  respostas = Array(questoesSelecionadas.length).fill(null);

  montarProva();
}

function selecionar(idx, letra){
  const tipoAnterior = (respostas[idx] && respostas[idx].tipo) ? respostas[idx].tipo : 'estudado';
  respostas[idx] = { letra: letra, tipo: tipoAnterior, confirmado: true };
  
  document.querySelectorAll(`#q${idx} .btn-alt`).forEach(b => b.classList.remove('selecionada'));
  const btnSel = document.getElementById(`alt${idx}${letra}`);
  if(btnSel) btnSel.classList.add('selecionada');

  const acoesEl = document.getElementById(`acoes${idx}`);
  if(acoesEl) acoesEl.style.display = 'block';

  confirmarTipo(idx, tipoAnterior);
}

function confirmarTipo(idx, tipo){
  if(!respostas[idx] || !respostas[idx].letra) return alert('Selecione uma alternativa primeiro!');
  respostas[idx].tipo = tipo;

  const btnEstudado = document.getElementById(`btnEstudado${idx}`);
  const btnChute = document.getElementById(`btnChute${idx}`);

  if(btnEstudado && btnChute){
    btnEstudado.classList.remove('ativo');
    btnChute.classList.remove('ativo');

    if(tipo === 'estudado') btnEstudado.classList.add('ativo');
    if(tipo === 'chute') btnChute.classList.add('ativo');
  }
}

function corrigirRedacao(){
  salvarTextoRedacao();
  const textoOriginal = textoRedacaoSalvo.trim();
  detalhesRedacaoPontos = [];
  
  if(textoOriginal.length < 20){
    notaRedacao = 0;
    resultadoRedacaoHTML = `
      <div style="background:#fff3e0;border:1px solid var(--laranja);padding:12px;border-radius:6px">
        ⚠️ Escreva um texto de pelo menos 20 caracteres para obter o diagnóstico da redação.
      </div>
    `;
    const elRes = document.getElementById('resultadoRedacao');
    if(elRes){
      elRes.innerHTML = resultadoRedacaoHTML;
      elRes.style.display = 'block';
    }
    return;
  }

  const ehCodigoHTML = /<!DOCTYPE|<html|<style|<script|var\s+--|\{font-family/i.test(textoOriginal);
  if(ehCodigoHTML){
    notaRedacao = 0;
    detalhesRedacaoPontos.push("📌 <strong>Ponto de Atenção:</strong> Código fonte detetado. Escreva apenas o texto da sua redação.");
    
    resultadoRedacaoHTML = `
      <div style="background:#ffebee;border:2px solid var(--vermelho);padding:14px;border-radius:8px">
        <h4 style="color:var(--vermelho);margin-top:0">❌ REDAÇÃO REPROVADA: NOTA 0 / 1000 PTS</h4>
        <p style="color:var(--vermelho);font-weight:bold;margin-bottom:0">Formato Inválido (Código Fonte Detetado)!</p>
      </div>
    `;
    const elRes = document.getElementById('resultadoRedacao');
    if(elRes){
      elRes.innerHTML = resultadoRedacaoHTML;
      elRes.style.display = 'block';
    }
    return;
  }
  
  const texto = textoOriginal.replace(/<[^>]*>?/gm, '');
  const palavrasChave = palavrasChaveTemas[(numeroProvaAtual - 1) % 15];
  const textoLower = texto.toLowerCase();
  
  const coincidencias = palavrasChave.filter(p => textoLower.includes(p));
  const possuiPertinencia = coincidencias.length >= 2;

  if(!possuiPertinencia){
    notaRedacao = 0;
    detalhesRedacaoPontos.push(`📌 <strong>Ponto de Atenção:</strong> Fuga ao Tema. O tema da Prova ${String(numeroProvaAtual).padStart(2, '0')} trata de "${temaRedacaoAtual}". O texto não usou os conceitos principais.`);
    
    resultadoRedacaoHTML = `
      <div style="background:#ffebee;border:2px solid var(--vermelho);padding:14px;border-radius:8px">
        <h4 style="color:var(--vermelho);margin-top:0">❌ REDAÇÃO REPROVADA: NOTA 0 / 1000 PTS</h4>
        <p style="color:var(--vermelho);font-weight:bold;margin-bottom:0">Fuga ao Tema Proposto!</p>
        <p style="font-size:13px;color:#333;margin-top:6px">Redija um texto focado em <strong>"${temaRedacaoAtual}"</strong> para obter pontuação.</p>
      </div>
    `;
    const elRes = document.getElementById('resultadoRedacao');
    if(elRes){
      elRes.innerHTML = resultadoRedacaoHTML;
      elRes.style.display = 'block';
    }
    return;
  }

  const linhas = texto.split('\n').filter(l => l.trim().length > 0);
  const palavras = texto.split(/\s+/).length;
  const paragrafos = texto.split(/\n\s*\n/).filter(p => p.trim().length > 0);
  const conectivos = (texto.match(/portanto|assim|além disso|contudo|porém|em suma|logo|dessa forma|desse modo|diante disso|em primeiro lugar/gi) || []).length;
  
  let nota = 0;

  if(linhas.length > 1 && linhas[0].length < 70){
    nota += 200;
    detalhesRedacaoPontos.push("🌟 <strong>Muito bom:</strong> Título destacado na primeira linha!");
  } else {
    detalhesRedacaoPontos.push("📌 <strong>Dica:</strong> Crie um título curto na 1ª linha para valorizar a apresentação.");
  }

  if(paragrafos.length >= 4){
    nota += 300;
    detalhesRedacaoPontos.push("🌟 <strong>Parabéns:</strong> Estrutura completa em 4 parágrafos (Introdução, D1, D2 e Conclusão).");
  } else {
    nota += paragrafos.length * 60;
    detalhesRedacaoPontos.push(`📌 <strong>Dica:</strong> Organize o texto em 4 parágrafos para encorpar suas ideias.`);
  }

  if(palavras >= 150 && palavras <= 300){
    nota += 300;
    detalhesRedacaoPontos.push(`🌟 <strong>Excelente extensão:</strong> ${palavras} palavras (média de 4 a 5 linhas por parágrafo).`);
  } else if(palavras < 150){
    nota += Math.round((palavras / 150) * 200);
    detalhesRedacaoPontos.push(`📌 <strong>Dica:</strong> Escreva um pouco mais (mínimo de 150 palavras) para aprofundar os argumentos.`);
  } else {
    nota += 200;
    detalhesRedacaoPontos.push(`📌 <strong>Dica:</strong> Mantenha o texto dentro do limite de 300 palavras.`);
  }

  if(conectivos >= 3){
    nota += 200;
    detalhesRedacaoPontos.push(`🌟 <strong>Ótima coesão:</strong> Boa ligação entre as frases e parágrafos.`);
  } else {
    nota += conectivos * 60;
    detalhesRedacaoPontos.push("📌 <strong>Dica de Ouro:</strong> Use palavras de transição como 'portanto', 'além disso', 'dessa forma'.");
  }

  notaRedacao = Math.min(1000, nota);

  resultadoRedacaoHTML = `
    <h4>📊 Nota Estrutural da Redação: ${notaRedacao} / 1000 pts</h4>
    <div style="font-size:14px;line-height:1.6">${detalhesRedacaoPontos.map(d => `<p style="margin:4px 0">${d}</p>`).join('')}</div>
  `;

  const elRes = document.getElementById('resultadoRedacao');
  if(elRes){
    elRes.innerHTML = resultadoRedacaoHTML;
    elRes.style.display = 'block';
  }
}

          <div style="margin-top:6px"><strong>Explicação Construtiva:</strong> ${q.explicacao}</div>

  if(modoAtual !== 'texto' && respondidas < questoesSelecionadas.length){
    return alert(`Responda todas as ${questoesSelecionadas.length} questões antes de finalizar!`);
  }

  const notaQ = Math.round((acertosTotal / questoesSelecionadas.length) * 1000);
  const notaFinalGeral = Math.round((notaQ + notaRedacao) / 2);
  const percentualMeta = Math.min(100, Math.round((notaFinalGeral / META_FIXA) * 100));

  let htmlPlanoEstudo = `
    <div class="box-estudo">
      <h4>🌱 Caminho para o Próximo Nível (Apoio aos Pais e Aluno):</h4>
      <p><strong>Nossa Meta:</strong> O objetivo deste treino é identificar o que já dominamos e o que podemos melhorar juntos!</p>
      <ul>
  `;
  
  if(errosMapeados.length > 0){
    errosMapeados.forEach(e => {
      htmlPlanoEstudo += `<li>📘 <strong>${e.materia} (${e.serie}):</strong> Vale a pena dar uma olhada em <em>${e.topico}</em>.</li>`;
    });
  } else {
    htmlPlanoEstudo += `<li>🎉 <strong>Incrível!</strong> Você mandou muito bem nas questões objetivas deste simulado.</li>`;
  }

  if(acertosChute > 0){
    htmlPlanoEstudo += `<li>🍀 <strong>Dica Amiga:</strong> Você acertou ${acertosChute} questão(ões) no chute. Revise a explicação para transformar sorte em certeza!</li>`;
  }
  htmlPlanoEstudo += `</ul></div>`;

  relatorioWhatsAppTexto = `*RELATÓRIO DE EVOLUÇÃO E TREINO - SETA PREPARATÓRIO*\n` +
    `*Aluno(a):* ${userLogin}\n` +
    `*Simulado:* Prova ${String(numeroProvaAtual).padStart(2, '0')}\n` +
    `*Desempenho Atual:* ${percentualMeta}% da Meta (${notaFinalGeral}/1000 pts)\n\n` +
    `*Resumo do Treino:*\n` +
    `• Questões Objetivas: ${notaQ}/1000 (${acertosTotal}/${questoesSelecionadas.length} acertos)\n` +
    `  - Domínio Pleno: ${acertosConhecimento} acerto(s)\n` +
    `  - Chutes Certo: ${acertosChute} acerto(s)\n` +
    `• Redação: ${notaRedacao}/1000 pts\n\n` +
    `*Pontos de Destaque e Aprendizado:*\n`;

  detalhesRedacaoPontos.forEach(d => {
    const textoLimpo = d.replace(/<[^>]*>/g, '');
    relatorioWhatsAppTexto += `${textoLimpo}\n`;
  });

  if(errosMapeados.length > 0){
    relatorioWhatsAppTexto += `\n*Assuntos para Repassar em Casa:*\n`;
    errosMapeados.forEach(e => {
      relatorioWhatsAppTexto += `• ${e.materia} (${e.serie}): ${e.topico}\n`;
    });
  }

  relatorioWhatsAppTexto += `\n🚀 _Estamos juntos nessa jornada de treino! Fale com seus pais e vamos continuar evoluindo!_`;

  let htmlResultado = `
    <h3>📊 Relatório Construtivo - Prova ${String(numeroProvaAtual).padStart(2, '0')}</h3>
    <h2>Aproveitamento Atual: ${notaFinalGeral} / 1000 pts (Meta Fixa: ${META_FIXA})</h2>
    <p><strong>Desempenho Objetiva:</strong> ${notaQ}/1000 (${acertosTotal}/${questoesSelecionadas.length} acertos)</p>
    <p><strong>Aproveitamento Redação:</strong> ${notaRedacao}/1000 pts</p>
    
    <div class="chance-box ${percentualMeta >= 80 ? 'chance-alta' : 'chance-construcao'}">
      🚀 EVOLUÇÃO NO SIMULADO: ${percentualMeta}% da Meta Concluída!<br>
      <span style="font-size:14px;font-weight:normal;color:#333">
        ${percentualMeta >= 80 ? 'Excelente ritmo! Você está muito próximo do padrão oficial!' : 'Você está no caminho! Cada simulado é uma oportunidade para aprender. Vamos juntos com seus pais melhorar no próximo!'}
      </span>
    </div>

    <div class="card" style="background:#f8f9fa;border:1px solid #ddd">
      <h4>📝 Feedback Orientativo da Redação:</h4>
      <div style="font-size:14px;line-height:1.6">${detalhesRedacaoPontos.map(d => `<p style="margin:4px 0">${d}</p>`).join('')}</div>
    </div>

    ${htmlPlanoEstudo}
    <hr>
    ${htmlGabaritoComentado}
  `;

  htmlResultado += `
    <hr>
    <div id="statusEnvio" style="font-weight:bold;color:var(--verde);margin-bottom:16px">⏳ Salvando treino na planilha...</div>
    
    <button class="btn-whats" onclick="enviarWhatsApp()">📱 Compartilhar Relatório no WhatsApp com os Pais e Liberar Próxima Prova</button>
    
    <button id="btnProximaProva" class="btn-seta" style="font-size:16px;width:100%;padding:14px;background:var(--azul)" disabled onclick="avancarParaProximaProva()">🔒 Compartilhe no WhatsApp para Liberar a Próxima Prova</button>
  `;
  
  document.getElementById('resultadoFinal').innerHTML = htmlResultado;
  document.getElementById('resultadoFinal').style.display = 'block';
  document.getElementById('areaProva').style.display = 'none';

  const telClean = userTelefone.replace(/\D/g, "");
  const progressoAlunos = JSON.parse(localStorage.getItem('progresso_provas') || '{}');
  progressoAlunos[telClean] = (progressoAlunos[telClean] || 0) + 1;
  localStorage.setItem('progresso_provas', JSON.stringify(progressoAlunos));

  enviarDadosAutomatico(notaQ, acertosTotal);
}

function enviarWhatsApp(){
  if(!relatorioWhatsAppTexto) return;
  const urlWa = `https://wa.me/?text=${encodeURIComponent(relatorioWhatsAppTexto)}`;
  window.open(urlWa, '_blank');

  const btnProx = document.getElementById('btnProximaProva');
  if(btnProx){
    btnProx.disabled = false;
    btnProx.innerHTML = `🎲 Fazer Próxima Prova (Prova ${String((numeroProvaAtual % 15) + 1).padStart(2, '0')})`;
  }
}

function avancarParaProximaProva(){
  const telClean = userTelefone.replace(/\D/g, "");
  const progressoAlunos = JSON.parse(localStorage.getItem('progresso_provas') || '{}');
  let qtdFeitas = progressoAlunos[telClean] || 0;
  numeroProvaAtual = (qtdFeitas % 15) + 1;

  textoRedacaoSalvo = '';
  limparRascunhoRedacao();

  document.getElementById('exibirIdentificadorProva').textContent = `Prova ${String(numeroProvaAtual).padStart(2, '0')}`;
  document.getElementById('resultadoFinal').style.display = 'none';
  document.getElementById('areaProva').style.display = 'block';

  gerarProvaSequencial();
}

function enviarDadosAutomatico(notaQ, acertosTotal){
  const agora = new Date();
  const tempoTotalMinutos = Math.max(1, Math.round((agora - tempoInicioApp) / 60000));
  const telClean = userTelefone.replace(/\D/g, "");
  const textoEscrito = textoRedacaoSalvo || "Redação não realizada nesta tentativa.";
  
  const chaveUnicaAluno = userLogin + "_" + telClean;

  const payload = {
    login: chaveUnicaAluno,
    data: agora.toLocaleDateString('pt-BR'),
    hora: agora.toLocaleTimeString('pt-BR'),
    prova: `Prova ${String(numeroProvaAtual).padStart(2, '0')}`,
    tema: temaRedacaoAtual,
    notaProva: notaQ,
    notaRedacao: notaRedacao,
    acertos: acertosTotal,
    tempoMinutos: tempoTotalMinutos,
    objetivoMeta: META_FIXA,
    textoRedacao: textoEscrito
  };

  fetch(URL_CEDAF, {
    method: 'POST',
    mode: 'no-cors',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  }).then(() => {
    document.getElementById('statusEnvio').innerHTML = "✅ Treino registrado com sucesso!";
    limparRascunhoRedacao();
  }).catch(err => {
    document.getElementById('statusEnvio').innerHTML = "❌ Erro ao salvar dados. Tente novamente.";
  });
}
</script>
</body>
</html>
