<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seta IA: Desperte para o essencial - Seta Soluções</title>
  <style>
    body { margin:0; font-family: Arial, sans-serif; background:#003366; color:#fff; padding-bottom: 30px; }
    .container { background:#fff; color:#000; max-width:600px; margin:20px auto; padding:20px; border-radius:12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    
    .header-topo { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding-bottom: 5px; }
    .header-logo img { max-width: 120px; height: auto; display: block; }
    .header-relogio { font-size: 12px; font-weight: bold; color: #003366; text-align: right; }

    h1 { text-align:center; color:#003366; font-size:22px; margin-bottom:5px; }
    .subtitle { text-align:center; color:#ff6600; font-size:13px; font-weight:bold; margin-bottom:15px; }

    #login { margin-bottom: 15px; padding: 12px; background: #f1f5f9; border-radius: 8px; border: none; box-shadow: none; }
    #login input { width: 68%; display: inline-block; margin-right: 8px; }
    #login button { width: 28%; display: inline-block; background:#16a34a; color:#fff; border:none; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer; }

    .section-header { display: flex; align-items: center; justify-content: space-between; margin-top: 15px; margin-bottom: 5px; gap: 10px; }
    label { font-size: 14px; font-weight: bold; color: #003366; margin: 0; }
    
    .btn-audio-inline { background: #002244; color: #fff; border: none; padding: 6px 12px; font-size: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
    .btn-audio-inline.gravando { background: #cc0000; animation: piscar 1s infinite; }

    textarea, select, input { width:100%; padding:10px; font-size:14px; border-radius:6px; border:1px solid #ccc; margin-bottom:10px; box-sizing: border-box; }
    textarea { min-height: 70px; }

    .checkbox-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .checkbox-btn { background:#e2e8f0; color:#334155; padding:6px 12px; border-radius:20px; font-size:12px; font-weight:bold; cursor:pointer; user-select:none; }
    .checkbox-btn.active { background:#ff6600; color:#fff; }

    .button-row { display:flex; gap:6px; margin-top:15px; flex-wrap: wrap; }
    button.action-btn { flex:1; min-width: 120px; background:#ff6600; color:#fff; border:none; padding:12px; font-size:13px; border-radius:6px; cursor:pointer; font-weight:bold; }

    .prompt-output { background:#f1f5f9; padding:12px; margin-top:15px; border-radius:6px; font-size:13px; border-left:4px solid #ff6600; white-space:pre-wrap; display:none; color:#000; }

    .ia-response-box { margin-top:20px; background:#f8fafc; padding:15px; border-radius:8px; border:1px solid #cbd5e1; }
    .feedback-buttons { display:flex; gap:8px; margin-top:10px; }
    .fb-btn { flex:1; padding:8px; border:none; border-radius:6px; font-size:12px; font-weight:bold; cursor:pointer; color:#fff; }
    .fb-btn.yes { background:#16a34a; }
    .fb-btn.no { background:#dc2626; }
    .fb-btn.missing { background:#ca8a04; }

    .footer-btn { background:#002244; color:#fff; border:none; padding:10px; font-size:13px; border-radius:6px; cursor:pointer; width:100%; font-weight:bold; margin-top:10px; }

    @media print {
      body { background: #fff; color: #000; }
      .container { box-shadow: none; margin: 0; padding: 0; max-width: 100%; }
      .btn-audio-inline, .button-row, input[type="file"], .feedback-buttons, .footer-btn { display: none!important; }
      textarea, select { border: none; background: transparent; padding: 0; }
      .prompt-output { display: block!important; border: 1px solid #ccc; }
    }
    @keyframes piscar { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-topo">
      <div class="header-logo">
        <img src="logo.png" alt="Seta Soluções">
      </div>
      <div class="header-relogio" id="relogio-dinamico">Carregando data e hora...</div>
    </div>

    <h1>Estamos juntos nisso.</h1>
    <div class="subtitle">Refine sua intenção: Garanta respostas precisas da IA eliminando desvios de escopo.</div>

    <div id="login">
      <input type="text" id="input-telefone" placeholder="(xx) xxxxx-xxxx" maxlength="15" oninput="mascaraTelefone(this)">
      <button type="button" onclick="fazerLogin()">Fazer Login</button>
    </div>

    <div class="section-header">
      <label for="solicitacao">1. Sua Solicitação</label>
      <button id="mic-solicitacao" class="btn-audio-inline" type="button" onclick="gerenciarAudio('solicitacao', this)">🎤 Gravar Áudio</button>
    </div>
    <textarea id="solicitacao" placeholder="Ex: Escreva uma mensagem curta de incentivo..."></textarea>

    <div class="section-header">
      <label for="detalhe">2. O que deseja detalhar?</label>
      <button id="mic-detalhe" class="btn-audio-inline" type="button" onclick="gerenciarAudio('detalhe', this)">🎤 Gravar Áudio</button>
    </div>
    <textarea id="detalhe" placeholder="Adicione fatos ou dados extras que ajudam a clarear o cenário atual..."></textarea>

    <label style="margin-top: 15px;">3. O que você quer EVITAR?</label>
    <div class="checkbox-group" style="margin-top: 8px;">
      <div class="checkbox-btn" onclick="toggleFiltro(this, 'Não quero texto longo ou enrolação.')">⬜ Sem enrolação</div>
      <div class="checkbox-btn" onclick="toggleFiltro(this, 'Evite teoria excessiva, foque em passos práticos.')">⬜ Foco Prático</div>
      <div class="checkbox-btn" onclick="toggleFiltro(this, 'A solução não deve depender de computador, opero apenas via celular.')">⬜ Uso no Celular</div>
      <div class="checkbox-btn" onclick="toggleFiltro(this, 'Não traga termos técnicos complexos, simplifique a linguagem.')">⬜ Linguagem Simples</div>
      <div class="checkbox-btn" onclick="toggleFiltro(this, 'Não inventa analise de baixo nivel não precisa')">⬜ Sem Análise Baixa</div>
      <div class="checkbox-btn" onclick="toggleFiltro(this, 'Evite introduções e conclusões automáticas.')">⬜ Sem Floreios</div>
    </div>
    <textarea id="evitar" placeholder="Escreva o que está fora de cogitação..."></textarea>

    <div class="button-row">
      <button class="action-btn" type="button" onclick="gerarPromptEstruturado()">Me ajuda com isso</button>
      <button class="action-btn" type="button" onclick="copiarPromptGerado()">Copiar Prompt</button>
      <button class="action-btn" type="button" style="background:#0284c7;" onclick="gerarRelatorioPDF()">Gerar PDF</button>
    </div>

    <div class="prompt-output" id="prompt-final"></div>

    <div class="ia-response-box">
      <label for="resposta_ia" style="margin-top:0;">5. Cole aqui o retorno que a IA te deu:</label>
      <textarea id="resposta_ia" placeholder="Cole a resposta gerada para registrar o feedback..."></textarea>

      <div class="feedback-buttons">
        <button class="fb-btn yes" type="button" onclick="executarFeedback('Acertou')">👍 Acertou</button>
        <button class="fb-btn no" type="button" onclick="executarFeedback('Errou')">👎 Errou</button>
        <button class="fb-btn missing" type="button" onclick="executarFeedback('Faltou Contexto')">⚠️ Faltou Contexto</button>
      </div>

      <button class="footer-btn" type="button" onclick="copiarRelatorioFeedback()">Copiar Relatório de Feedback</button>
      <button class="footer-btn" type="button" style="background:#0284c7;" onclick="window.location.reload()">Continuar interação</button>
    </div>

  </div>

  <script src="google.js"></script>
  <script src="script.js"></script>
</body>
</html>
